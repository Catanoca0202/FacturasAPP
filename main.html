    <script>
      function handleServerError(error) {
        console.error('Error en llamada a servidor:', error && error.message ? error.message : error);
        // Mostrar error en el sidebar si es un objeto de mensaje
        if (error && typeof error === 'object' && error.tipo) {
          mostrarMensaje(error.mensaje, error.tipo, error.titulo);
        } else {
          // Error genérico
          const mensajeError = error && error.message ? error.message : (typeof error === 'string' ? error : 'Ocurrió un error inesperado');
          mostrarError(mensajeError);
        }
      }
      
      // Wrapper para funciones que devuelven mensajes
      function ejecutarConMensaje(funcion, ...args) {
        google.script.run
          .withSuccessHandler(function(resultado) {
            // Si el resultado es un mensaje, mostrarlo
            if (resultado && typeof resultado === 'object' && resultado.tipo) {
              mostrarMensaje(resultado.mensaje, resultado.tipo, resultado.titulo);
            } else if (resultado && typeof resultado === 'object' && resultado.requiereConfirmacion) {
              // Mostrar confirmación
              mostrarConfirmacion(
                resultado.mensaje,
                resultado.titulo || 'Confirmar',
                function() {
                  // Usuario confirmó, ejecutar acción
                  if (resultado.funcionConfirmar) {
                    google.script.run
                      .withSuccessHandler(function(resp) {
                        if (resp && typeof resp === 'object' && resp.tipo) {
                          mostrarMensaje(resp.mensaje, resp.tipo, resp.titulo);
                        }
                      })
                      .withFailureHandler(handleServerError)
                      [resultado.funcionConfirmar]();
                  }
                },
                function() {
                  // Usuario canceló
                  if (resultado.mensajeCancelar) {
                    mostrarInfo(resultado.mensajeCancelar);
                  }
                }
              );
            }
          })
          .withFailureHandler(handleServerError)
          [funcion](...args);
      }

      function showView(view) {
        var views = ['inicio', 'ajustes', 'vincular', 'desvincular', 'eliminarInfo', 'facturaMenu', 'facturaNueva', 'clientes', 'clienteCrear', 'productos', 'productoCrear'];
        views.forEach(function(v) {
          var el = document.getElementById('view-' + v);
          if (el) el.style.display = (v === view) ? 'block' : 'none';
        });
      }

      function openFactura() {
        abrirMenuFactura();
      }
      function openClientes() {
        google.script.run
          .withSuccessHandler(function(resultado) {
            if (resultado && typeof resultado === 'object' && resultado.tipo) {
              mostrarMensaje(resultado.mensaje, resultado.tipo, resultado.titulo);
            } else if (resultado && resultado.exito) {
              google.script.run
                .withFailureHandler(handleServerError)
                .openClientesSheet();
              showView('clientes');
            }
          })
          .withFailureHandler(handleServerError)
          .showClientes();
      }
      function showPreProductos() {
        google.script.run
          .withSuccessHandler(function(resultado) {
            if (resultado && typeof resultado === 'object' && resultado.tipo) {
              mostrarMensaje(resultado.mensaje, resultado.tipo, resultado.titulo);
            } else if (resultado && resultado.exito) {
              // Mostrar menú de productos dentro del SPA
              showView('productos');
            }
          })
          .withFailureHandler(handleServerError)
          .showPreProductos();
      }
      function openAjustes() {
        // Mantener la navegación a la hoja de Datos de emisor si es necesaria
        google.script.run
          .withFailureHandler(handleServerError)
          .openDatosEmisorSheet();
        // Cambiar solo la vista dentro del mismo sidebar (SPA)
        showView('ajustes');
      }

      function showVincular() {
        showView('vincular');
      }
      function showDesvincular() {
        showView('desvincular');
      }
      function showEliminarInfo() {
        showView('eliminarInfo');
      }

      // Flujo de facturación dentro del SPA
      function iniciarNuevaFactura() {
        google.script.run
          .withSuccessHandler(function(resultado) {
            if (resultado && typeof resultado === 'object' && resultado.tipo) {
              mostrarMensaje(resultado.mensaje, resultado.tipo, resultado.titulo);
            } else if (resultado && resultado.exito) {
              google.script.run
                .withFailureHandler(handleServerError)
                .openFacturaSheet();
              google.script.run
                .withFailureHandler(handleServerError)
                .inicarFacturaNueva();
              showView('facturaNueva');
            }
          })
          .withFailureHandler(handleServerError)
          .showMenuFactura();
      }
      
      function abrirMenuFactura() {
        google.script.run
          .withSuccessHandler(function(resultado) {
            if (resultado && typeof resultado === 'object' && resultado.tipo) {
              mostrarMensaje(resultado.mensaje, resultado.tipo, resultado.titulo);
            } else if (resultado && resultado.exito) {
              showView('facturaMenu');
            }
          })
          .withFailureHandler(handleServerError)
          .showMenuFactura();
      }

      function abrirHistorialFacturas() {
        google.script.run
          .withFailureHandler(handleServerError)
          .openHistorialSheet();
      }

      function facturaAbrirHoja() {
        google.script.run
          .withFailureHandler(handleServerError)
          .openFacturaSheet();
      }

      function facturaLimpiar() {
        google.script.run
          .withFailureHandler(handleServerError)
          .limpiarHojaFactura();
      }

      function facturaAgregarProducto() {
        // Abre el flujo de agregar producto desde la hoja de factura
        google.script.run
          .withFailureHandler(handleServerError)
          .showAggProductos();
      }

      function facturaGuardar() {
        google.script.run
          .withSuccessHandler(function(resultado) {
            if (resultado && typeof resultado === 'object' && resultado.tipo) {
              mostrarMensaje(resultado.mensaje, resultado.tipo, resultado.titulo);
            } else if (resultado && resultado.exito) {
              mostrarExito('Operación completada exitosamente.');
            }
          })
          .withFailureHandler(handleServerError)
          .guardarFactura();
      }

      function abrirSoporte() {
        window.open('https://soporte.facturasapp.com/hc/es-es/articles/34324157226907-Canales-de-Atenci%C3%B3n');
      }

      // Sistema de mensajes dentro del sidebar (reemplaza pop-ups)
      let mensajeCallback = null;
      
      function mostrarMensaje(mensaje, tipo, titulo, callback) {
        tipo = tipo || 'info'; // info, success, error, warning
        titulo = titulo || (tipo === 'success' ? 'Éxito' : tipo === 'error' ? 'Error' : tipo === 'warning' ? 'Advertencia' : 'Información');
        mensaje = mensaje || '';
        mensajeCallback = callback || null;
        
        // Iconos según tipo
        const iconos = {
          success: 'icon-24-outlined-suggested-symbol',
          error: 'icon-24-outlined-suggested-symbol',
          warning: 'icon-24-outlined-suggested-symbol',
          info: 'icon-info'
        };
        
        const colores = {
          success: '#28a745',
          error: '#dc3545',
          warning: '#ffc107',
          info: '#17a2b8'
        };
        
        // Crear o actualizar el modal
        let modalElement = document.getElementById('sidebarMensaje');
        if (!modalElement) {
          const modalHTML = `
            <div class="modal fade" id="sidebarMensaje" tabindex="-1" aria-labelledby="sidebarMensajeLabel" aria-hidden="true">
              <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                  <div class="modal-body text-center p-4">
                    <div class="mb-3">
                      <i id="sidebarMensajeIcono" class="${iconos[tipo]}" style="font-size: 64px; color: ${colores[tipo]};"></i>
                    </div>
                    <h5 class="modal-title mb-2" id="sidebarMensajeTitulo">${titulo}</h5>
                    <p class="mb-0" id="sidebarMensajeTexto" style="white-space: pre-wrap;">${mensaje}</p>
                  </div>
                  <div class="modal-footer justify-content-center border-0 pb-4">
                    <button type="button" class="btn btn-primary" id="sidebarMensajeBtn" onclick="cerrarMensaje()">Aceptar</button>
                  </div>
                </div>
              </div>
            </div>
          `;
          document.body.insertAdjacentHTML('beforeend', modalHTML);
          modalElement = document.getElementById('sidebarMensaje');
        }
        
        // Actualizar contenido
        document.getElementById('sidebarMensajeIcono').className = iconos[tipo];
        document.getElementById('sidebarMensajeIcono').style.color = colores[tipo];
        document.getElementById('sidebarMensajeTitulo').textContent = titulo;
        document.getElementById('sidebarMensajeTexto').textContent = mensaje;
        
        // Mostrar modal
        modalElement.style.display = 'block';
        modalElement.classList.add('show');
        document.body.classList.add('modal-open');
        
        // Crear backdrop si no existe
        let backdrop = document.getElementById('sidebarMensajeBackdrop');
        if (!backdrop) {
          backdrop = document.createElement('div');
          backdrop.className = 'modal-backdrop fade show';
          backdrop.id = 'sidebarMensajeBackdrop';
          backdrop.onclick = cerrarMensaje;
          document.body.appendChild(backdrop);
        }
      }
      
      function mostrarConfirmacion(mensaje, titulo, callbackSi, callbackNo) {
        titulo = titulo || 'Confirmar';
        mensaje = mensaje || '¿Estás seguro?';
        
        // Crear o actualizar el modal de confirmación
        let modalElement = document.getElementById('sidebarConfirmacion');
        if (!modalElement) {
          const modalHTML = `
            <div class="modal fade" id="sidebarConfirmacion" tabindex="-1" aria-labelledby="sidebarConfirmacionLabel" aria-hidden="true">
              <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                  <div class="modal-body text-center p-4">
                    <div class="mb-3">
                      <i class="icon-info" style="font-size: 64px; color: #17a2b8;"></i>
                    </div>
                    <h5 class="modal-title mb-2" id="sidebarConfirmacionTitulo">${titulo}</h5>
                    <p class="mb-0" id="sidebarConfirmacionTexto" style="white-space: pre-wrap;">${mensaje}</p>
                  </div>
                  <div class="modal-footer justify-content-center border-0 pb-4 gap-2">
                    <button type="button" class="btn btn-secondary" id="sidebarConfirmacionNo" onclick="cerrarConfirmacion(false)">No</button>
                    <button type="button" class="btn btn-primary" id="sidebarConfirmacionSi" onclick="cerrarConfirmacion(true)">Sí</button>
                  </div>
                </div>
              </div>
            </div>
          `;
          document.body.insertAdjacentHTML('beforeend', modalHTML);
          modalElement = document.getElementById('sidebarConfirmacion');
        }
        
        // Guardar callbacks
        window.confirmacionCallbackSi = callbackSi || null;
        window.confirmacionCallbackNo = callbackNo || null;
        
        // Actualizar contenido
        document.getElementById('sidebarConfirmacionTitulo').textContent = titulo;
        document.getElementById('sidebarConfirmacionTexto').textContent = mensaje;
        
        // Mostrar modal
        modalElement.style.display = 'block';
        modalElement.classList.add('show');
        document.body.classList.add('modal-open');
        
        // Crear backdrop si no existe
        let backdrop = document.getElementById('sidebarConfirmacionBackdrop');
        if (!backdrop) {
          backdrop = document.createElement('div');
          backdrop.className = 'modal-backdrop fade show';
          backdrop.id = 'sidebarConfirmacionBackdrop';
          backdrop.onclick = function() { cerrarConfirmacion(false); };
          document.body.appendChild(backdrop);
        }
      }
      
      function cerrarMensaje() {
        const modalElement = document.getElementById('sidebarMensaje');
        const backdrop = document.getElementById('sidebarMensajeBackdrop');
        if (modalElement) {
          modalElement.style.display = 'none';
          modalElement.classList.remove('show');
          document.body.classList.remove('modal-open');
        }
        if (backdrop) {
          backdrop.remove();
        }
        if (mensajeCallback) {
          mensajeCallback();
          mensajeCallback = null;
        }
      }
      
      function cerrarConfirmacion(respuesta) {
        const modalElement = document.getElementById('sidebarConfirmacion');
        const backdrop = document.getElementById('sidebarConfirmacionBackdrop');
        if (modalElement) {
          modalElement.style.display = 'none';
          modalElement.classList.remove('show');
          document.body.classList.remove('modal-open');
        }
        if (backdrop) {
          backdrop.remove();
        }
        if (respuesta && window.confirmacionCallbackSi) {
          window.confirmacionCallbackSi();
        } else if (!respuesta && window.confirmacionCallbackNo) {
          window.confirmacionCallbackNo();
        }
        window.confirmacionCallbackSi = null;
        window.confirmacionCallbackNo = null;
      }
      
      // Funciones de conveniencia
      function mostrarExito(mensaje, titulo, callback) {
        mostrarMensaje(mensaje, 'success', titulo, callback);
      }
      
      function mostrarError(mensaje, titulo, callback) {
        mostrarMensaje(mensaje, 'error', titulo, callback);
      }
      
      function mostrarAdvertencia(mensaje, titulo, callback) {
        mostrarMensaje(mensaje, 'warning', titulo, callback);
      }
      
      function mostrarInfo(mensaje, titulo, callback) {
        mostrarMensaje(mensaje, 'info', titulo, callback);
      }
    </script>

   <script>
     // Verificar si necesita instalación al cargar el sidebar
     (function() {
       // Esperar a que el DOM esté listo
       if (document.readyState === 'loading') {
         document.addEventListener('DOMContentLoaded', verificarInstalacion);
       } else {
         verificarInstalacion();
       }
       
       function verificarInstalacion() {
         // Llamar a showSidebar2 para obtener el estado
         google.script.run
           .withSuccessHandler(function(resultado) {
             if (resultado && resultado.requiereConfirmacion) {
               mostrarConfirmacion(
                 resultado.mensaje,
                 resultado.titulo || 'Confirmar',
                 function() {
                   // Usuario confirmó
                   if (resultado.funcionConfirmar) {
                     google.script.run
                       .withSuccessHandler(function(resp) {
                         if (resp && typeof resp === 'object' && resp.tipo) {
                           mostrarMensaje(resp.mensaje, resp.tipo, resp.titulo);
                         } else if (resp && resp.exito) {
                           mostrarExito('Instalación completada exitosamente.');
                         }
                       })
                       .withFailureHandler(handleServerError)
                       [resultado.funcionConfirmar]();
                   }
                 },
                 function() {
                   // Usuario canceló
                   if (resultado.mensajeCancelar) {
                     mostrarInfo(resultado.mensajeCancelar);
                   }
                 }
               );
             }
           })
           .withFailureHandler(function(error) {
             // Si falla, no hacer nada (puede ser que ya esté instalado)
             console.log('Verificación de instalación:', error);
           })
           .verificarEstadoInstalacion();
       }
     })();
   </script>
