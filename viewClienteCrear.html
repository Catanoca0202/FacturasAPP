<div class="row py-3 px-4 gx-0">
  <div class="col-12 py-4">
    <h2 class="mt-1">Crear contacto</h2>
    <p>Ingresa la información de tu nuevo contacto.</p>
  </div>

  <div class="col-12 px-0">
    <form class="row g-3" id="clientForm">
      <div class="col-md-12">
        <label for="tipoContacto" class="form-label">Tipo de contacto</label>
        <select id="tipoContacto" class="form-select form-select-lg">
          <option selected>Cliente</option>
          <option>Proveedor</option>
        </select>
      </div>

      <div class="col-md-12">
        <label for="tipoPersona" class="form-label">Tipo de persona</label>
        <select id="tipoPersona" class="form-select form-select-lg">
          <option selected>Autónomo</option>
          <option>Empresa</option>
          <option>Persona Física</option>
        </select>
      </div>

      <div class="col-md-6">
        <label for="tipoDocumento" class="form-label">Tipo de documento</label>
        <select id="tipoDocumento" class="form-select form-select-lg">
          <option selected>NIF-IVA</option>
          <option>Pasaporte</option>
          <option>Documento oficial de identificación expedido por</option>
          <option>Certificado de residencia</option>
          <option>Otro documento aprobado</option>
          <option>No censado</option>
        </select>
      </div>

      <div class="col-md-6">
        <label for="numeroIdentificacion" class="form-label">Núm. de documento</label>
        <input type="text" class="form-control form-control-lg" id="numeroIdentificacion" placeholder="Número de identificación">
      </div>

      <div class="col-md-6">
        <label for="codigoContacto" class="form-label">Código contacto</label>
        <input type="text" class="form-control form-control-lg" id="codigoContacto" placeholder="Código contacto">
      </div>

      <div class="col-md-6">
        <label for="regimen" class="form-label">Régimen</label>
        <select id="regimen" class="form-select form-select-lg">
          <option selected>Operación de régimen general</option>
          <option>Exportación</option>
          <option>Operaciones a las que se aplique el régimen especial de bienes usados...</option>
          <option>Régimen especial del oro de inversión</option>
          <option>Régimen especial de las agencias de viajes</option>
          <option>Régimen especial grupo de entidades en IVA (Nivel Avanzado)</option>
          <option>Régimen especial del criterio de caja</option>
          <option>Operaciones sujetas al IPSI / IGIC</option>
          <option>Facturación de las prestaciones de servicios de agencias de viaje...</option>
          <option>Cobros por cuenta de terceros...</option>
          <option>Operaciones de arrendamiento de local de negocio</option>
          <option>Factura con IVA pendiente de devengo en certificaciones de obra...</option>
          <option>Factura con IVA pendiente de devengo en operaciones de tracto sucesivo</option>
          <option>Régimen simplificado</option>
          <option>Recargo de equivalencia</option>
          <option>Régimen especial de la agricultura</option>
          <option>Operación acogida a regímenes Capítulo XI Título IX (OSS e IOSS)</option>
        </select>
      </div>

      <div class="col-md-6">
        <label for="nombreComercial" class="form-label">Nombre empresa</label>
        <input type="text" class="form-control form-control-lg" id="nombreComercial" placeholder="Nombre empresa">
      </div>

      <div class="col-md-6">
        <label for="primerNombre" class="form-label">Primer nombre</label>
        <input type="text" class="form-control form-control-lg" id="primerNombre" placeholder="Primer nombre">
      </div>

      <div class="col-md-6">
        <label for="segundoNombre" class="form-label">Segundo nombre</label>
        <input type="text" class="form-control form-control-lg" id="segundoNombre" placeholder="Segundo nombre">
      </div>

      <div class="col-md-6">
        <label for="primerApellido" class="form-label">Primer apellido</label>
        <input type="text" class="form-control form-control-lg" id="primerApellido" placeholder="Primer apellido">
      </div>

      <div class="col-md-6">
        <label for="segundoApellido" class="form-label">Segundo apellido</label>
        <input type="text" class="form-control form-control-lg" id="segundoApellido" placeholder="Segundo apellido">
      </div>

      <div class="col-md-12">
        <label for="pais" class="form-label">País</label>
        <select id="pais" class="form-select form-select-lg"></select>
      </div>

      <div class="col-md-12">
        <label for="provincia" class="form-label">Provincia</label>
        <select id="provincia" class="form-select form-select-lg"></select>
      </div>

      <div class="col-md-12">
        <label for="poblacion" class="form-label">Población</label>
        <select id="poblacion" class="form-select form-select-lg"></select>
      </div>

      <div class="col-md-12">
        <label for="direccion" class="form-label">Dirección</label>
        <input type="text" class="form-control form-control-lg" id="direccion" placeholder="Dirección">
      </div>

      <div class="col-md-12">
        <label for="codigoPostal" class="form-label">Código Postal</label>
        <input type="text" class="form-control form-control-lg" id="codigoPostal" placeholder="Código Postal">
      </div>

      <div class="col-md-12">
        <label for="telefono" class="form-label">Teléfono</label>
        <input type="text" class="form-control form-control-lg" id="telefono" placeholder="Teléfono">
      </div>

      <div class="col-md-12">
        <label for="sitioWeb" class="form-label">Sitio web</label>
        <input type="text" class="form-control form-control-lg" id="sitioWeb" placeholder="Sitio web">
      </div>

      <div class="col-md-12">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control form-control-lg" id="email" placeholder="Email">
      </div>
    </form>
  </div>

  <div class="col-12 mt-4 px-0 d-flex justify-content-between">
    <a href="#" onclick="showView('clientes')" class="btn btn-outline-secondary btn-lg">
      <i class="icon-left"></i>
      <span class="ms-1">Regresar</span>
    </a>
    <a href="#" onclick="saveData()" class="btn btn-primary btn-lg">
      <span class="">Agregar</span>
      <i class="icon-24-outlined-suggested-symbol" style="font-size: 18px;"></i>
    </a>
  </div>
</div>

<script>
  // Helpers para selects de país / provincia / población
  function fillSelectOptions(selectEl, values, placeholder) {
    selectEl.innerHTML = '';
    if (placeholder) {
      var opt = document.createElement('option');
      opt.value = '';
      opt.textContent = placeholder;
      selectEl.appendChild(opt);
    }
    (values || []).forEach(function(v) {
      var option = document.createElement('option');
      option.value = v;
      option.textContent = v;
      selectEl.appendChild(option);
    });
  }

  function cargarPaises() {
    google.script.run.withSuccessHandler(function(paises) {
      var selPais = document.getElementById('pais');
      fillSelectOptions(selPais, paises, 'Selecciona un país');
    }).apiGetCountries();
  }

  function onPaisChange() {
    var pais = document.getElementById('pais').value;
    var selProv = document.getElementById('provincia');
    var selPobl = document.getElementById('poblacion');
    fillSelectOptions(selProv, [], 'Selecciona una provincia');
    fillSelectOptions(selPobl, [], 'Selecciona una población');
    if (!pais) return;
    google.script.run.withSuccessHandler(function(provincias) {
      fillSelectOptions(selProv, provincias, 'Selecciona una provincia');
    }).apiGetProvinces(pais);
  }

  function onProvinciaChange() {
    var pais = document.getElementById('pais').value;
    var provincia = document.getElementById('provincia').value;
    var selPobl = document.getElementById('poblacion');
    fillSelectOptions(selPobl, [], 'Selecciona una población');
    if (!pais || !provincia) return;
    google.script.run.withSuccessHandler(function(poblaciones) {
      fillSelectOptions(selPobl, poblaciones, 'Selecciona una población');
    }).apiGetPopulations(pais, provincia);
  }

  function verificarDatosObligatorios() {
    const form = document.getElementById('clientForm');
    const tipoPersona = document.getElementById('tipoPersona').value;
    const isAutonomo = (tipoPersona === 'Autónomo' || tipoPersona === 'Persona Física');
    const columnasObligatorias = isAutonomo ?
      ['tipoContacto', 'tipoPersona', 'tipoDocumento', 'numeroIdentificacion', 'codigoContacto','regimen',  'primerNombre', 'primerApellido','codigoPostal', 'pais', 'provincia', 'poblacion', 'email'] :
      tipoPersona === 'Empresa' ?
      ['tipoContacto', 'tipoPersona', 'tipoDocumento', 'numeroIdentificacion',  'codigoContacto','regimen',  'nombreComercial', 'codigoPostal', 'pais', 'provincia', 'poblacion', 'email'] :
      [];

    let isValid = true;

    columnasObligatorias.forEach(id => {
      const field = document.getElementById(id);
      if (!field.value.trim()) {
        field.style.backgroundColor = '#FFC7C7';
        isValid = false;
      } else {
        field.style.backgroundColor = '';
      }
    });

    return isValid;
  }

  function saveData() {
    if (verificarDatosObligatorios()) {
      const formData = {
        tipoContacto: document.getElementById('tipoContacto').value,
        tipoPersona: document.getElementById('tipoPersona').value,
        tipoDocumento: document.getElementById('tipoDocumento').value,
        numeroIdentificacion: document.getElementById('numeroIdentificacion').value,
        codigoContacto: document.getElementById('codigoContacto').value,
        regimen: document.getElementById('regimen').value,
        nombreComercial: document.getElementById('nombreComercial').value,
        primerNombre: document.getElementById('primerNombre').value,
        segundoNombre: document.getElementById('segundoNombre').value,
        primerApellido: document.getElementById('primerApellido').value,
        segundoApellido: document.getElementById('segundoApellido').value,
        pais: document.getElementById('pais').value,
        provincia: document.getElementById('provincia').value,
        poblacion: document.getElementById('poblacion').value,
        direccion: document.getElementById('direccion').value,
        codigoPostal: document.getElementById('codigoPostal').value,
        telefono: document.getElementById('telefono').value,
        sitioWeb: document.getElementById('sitioWeb').value,
        email: document.getElementById('email').value,
      };

      google.script.run.withSuccessHandler(function(response) {
        if (response.success) {
          resetearFormulario();
          document.getElementById('tipoContacto').focus();
          // Mostrar modal de éxito bonito
          if (typeof mostrarModalExito === 'function') {
            mostrarModalExito(response.message || 'Cliente creado exitosamente.', 'Cliente creado');
          } else {
            mostrarAlerta(response.message);
          }
        } else {
          mostrarAlerta(response.message);
        }
      }).saveClientData(formData);
    } else {
      mostrarAlerta('Por favor complete todos los campos obligatorios.');
    }
  }

  function mostrarAlerta(mensaje) {
    google.script.run.mostrarAlertaDesdeServidor(mensaje);
  }

  function resetearFormulario() {
    document.getElementById('clientForm').reset();
    const campos = document.querySelectorAll('#clientForm input, #clientForm select');
    campos.forEach(campo => {
      campo.style.backgroundColor = '';
    });
    const resultBox = document.querySelector('.result-box');
    if (resultBox) {
      resultBox.innerHTML = '';
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    cargarPaises();
    document.getElementById('pais').addEventListener('change', onPaisChange);
    document.getElementById('provincia').addEventListener('change', onProvinciaChange);
  });
</script>
