<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 0;
      }
      .container {
        padding: 16px 20px;
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        gap: 12px;
      }
      .icon {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background-color: #e3f2fd;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #1976d2;
        font-size: 18px;
        flex-shrink: 0;
      }
      .text {
        font-size: 14px;
        color: #202124;
      }
      .text strong {
        display: block;
        margin-bottom: 2px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">⏳</div>
      <div class="text">
        <strong>Estamos generando tu factura…</strong>
        Tu factura se está generando, espera un momento por favor.
      </div>
    </div>
    <script>
      // Cerrar automáticamente el diálogo después de unos segundos
      setTimeout(function () {
        if (window.google && google.script && google.script.host) {
          google.script.host.close();
        }
      }, 4000); // 4 segundos
    </script>
  </body>
</html>
