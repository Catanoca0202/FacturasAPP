  <script>
    function abrirSoporte() {
  
        window.open('https://soporte.facturasapp.com/hc/es-es/articles/34324157226907-Canales-de-Atenci%C3%B3n')
      }

    function Back() {
      google.script.run.showClientes();
    }

    function showMenuPrincipal() {
        google.script.run.showSidebar();
      }

    // Helpers para selects de país / provincia / población
    function setLocationLoading(isLoading, text) {
      var loader = document.getElementById('locationLoader');
      var loaderText = document.getElementById('locationLoaderText');
      var selPais = document.getElementById('pais');
      var selProv = document.getElementById('provincia');
      var selPobl = document.getElementById('poblacion');

      if (loaderText) loaderText.textContent = text || 'Cargando…';
      if (loader) {
        if (isLoading) {
          loader.classList.remove('d-none');
          loader.classList.add('d-flex');
        } else {
          loader.classList.add('d-none');
          loader.classList.remove('d-flex');
        }
      }

      // Deshabilitar selects durante carga para evitar dobles llamadas
      if (selPais) selPais.disabled = !!isLoading;
      if (selProv) selProv.disabled = !!isLoading;
      if (selPobl) selPobl.disabled = !!isLoading;
    }

    function fillSelectOptions(selectEl, values, placeholder) {
      selectEl.innerHTML = '';
      if (placeholder) {
        var opt = document.createElement('option');
        opt.value = '';
        opt.textContent = placeholder;
        selectEl.appendChild(opt);
      }
      (values || []).forEach(function(v) {
        var option = document.createElement('option');
        option.value = v;
        option.textContent = v;
        selectEl.appendChild(option);
      });
    }

    function cargarPaises() {
      setLocationLoading(true, 'Cargando países…');
      google.script.run
        .withSuccessHandler(function(paises) {
          var selPais = document.getElementById('pais');
          fillSelectOptions(selPais, paises, 'Selecciona un país');
          setLocationLoading(false);
        })
        .withFailureHandler(function(err) {
          setLocationLoading(false);
          mostrarAlerta('Error cargando países: ' + (err && err.message ? err.message : err));
        })
        .apiGetCountries();
    }

    function onPaisChange() {
      var pais = document.getElementById('pais').value;
      var selProv = document.getElementById('provincia');
      var selPobl = document.getElementById('poblacion');
      fillSelectOptions(selProv, [], 'Selecciona una provincia');
      fillSelectOptions(selPobl, [], 'Selecciona una población');
      if (!pais) return;
      setLocationLoading(true, 'Cargando provincias…');
      google.script.run
        .withSuccessHandler(function(provincias) {
          fillSelectOptions(selProv, provincias, 'Selecciona una provincia');
          setLocationLoading(false);
        })
        .withFailureHandler(function(err) {
          setLocationLoading(false);
          mostrarAlerta('Error cargando provincias: ' + (err && err.message ? err.message : err));
        })
        .apiGetProvinces(pais);
    }

    function onProvinciaChange() {
      var pais = document.getElementById('pais').value;
      var provincia = document.getElementById('provincia').value;
      var selPobl = document.getElementById('poblacion');
      fillSelectOptions(selPobl, [], 'Selecciona una población');
      if (!pais || !provincia) return;
      setLocationLoading(true, 'Cargando poblaciones…');
      google.script.run
        .withSuccessHandler(function(poblaciones) {
          fillSelectOptions(selPobl, poblaciones, 'Selecciona una población');
          setLocationLoading(false);
        })
        .withFailureHandler(function(err) {
          setLocationLoading(false);
          mostrarAlerta('Error cargando poblaciones: ' + (err && err.message ? err.message : err));
        })
        .apiGetPopulations(pais, provincia);
    }

    function verificarDatosObligatorios() {
      const form = document.getElementById('clientForm');
      const tipoPersona = document.getElementById('tipoPersona').value;
      const isAutonomo = (tipoPersona === 'Autónomo' || tipoPersona === 'Persona Física');
      const columnasObligatorias = isAutonomo ?
        ['tipoContacto', 'tipoPersona', 'tipoDocumento', 'numeroIdentificacion', 'codigoContacto', 'primerNombre', 'primerApellido', 'codigoPostal', 'pais', 'provincia', 'poblacion', 'email'] :
        tipoPersona === 'Empresa' ?
        ['tipoContacto', 'tipoPersona', 'tipoDocumento', 'numeroIdentificacion', 'codigoContacto', 'nombreComercial', 'codigoPostal', 'pais', 'provincia', 'poblacion', 'email'] :
        [];

      let isValid = true;

      columnasObligatorias.forEach(id => {
        const field = document.getElementById(id);
        if (!field.value.trim()) {
          field.style.backgroundColor = '#FFC7C7';
          isValid = false;
        } else {
          field.style.backgroundColor = '';
        }
      });

      return isValid;
    }

  function saveData() {
  if (verificarDatosObligatorios()) {
    const formData = {
    
      tipoContacto: document.getElementById('tipoContacto').value,
      tipoPersona: document.getElementById('tipoPersona').value,
      tipoDocumento: document.getElementById('tipoDocumento').value,
      numeroIdentificacion: document.getElementById('numeroIdentificacion').value,
      codigoContacto: document.getElementById('codigoContacto').value,
      nombreComercial: document.getElementById('nombreComercial').value,
      primerNombre: document.getElementById('primerNombre').value,
      segundoNombre: document.getElementById('segundoNombre').value,
      primerApellido: document.getElementById('primerApellido').value,
      segundoApellido: document.getElementById('segundoApellido').value,
      pais: document.getElementById('pais').value,
      provincia: document.getElementById('provincia').value,
      poblacion: document.getElementById('poblacion').value,
      direccion: document.getElementById('direccion').value,
      codigoPostal: document.getElementById('codigoPostal').value,
      telefono: document.getElementById('telefono').value,
      sitioWeb: document.getElementById('sitioWeb').value,
      email: document.getElementById('email').value,
    };

    google.script.run.withSuccessHandler(function(response) {
      if (response.success) {
        
        
        // Limpiar el formulario
        resetearFormulario();
        document.getElementById('tipoContacto').focus();
      } else {
        mostrarAlerta(response.message)
        
      }
    }).saveClientData(formData);
  } else {
    mostrarAlerta("Por favor complete todos los campos obligatorios.")
    
  }
}
document.addEventListener('DOMContentLoaded', function() {
  cargarPaises();
  document.getElementById('pais').addEventListener('change', onPaisChange);
  document.getElementById('provincia').addEventListener('change', onProvinciaChange);
});
function mostrarAlerta(mensaje) {
        google.script.run.mostrarAlertaDesdeServidor(mensaje);
      }
function resetearFormulario() {
  // Restablecer los valores del formulario
  document.getElementById('clientForm').reset();

  // Restaurar el color de fondo de los campos
  const campos = document.querySelectorAll('#clientForm input, #clientForm select');
  campos.forEach(campo => {
    campo.style.backgroundColor = ''; // Restablecer el color de fondo
  });

  // Limpiar resultados del selector de país
  const resultBox = document.querySelector('.result-box');
  if (resultBox) {
    resultBox.innerHTML = '';
  }

  
}
  </script>
