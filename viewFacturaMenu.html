<div class="row py-3 px-4 gx-0">
  <div class="col-12 py-4 text-center">
    <h2 class="mt-1">Facturación</h2>
    <p>Gestiona, genera y envía tus facturas desde Google Sheets.</p>
  </div>

  <div class="col-12 px-0">
    <a onclick="iniciarNuevaFactura()" class="btn btn-lg btn-outline-secondary mb-2">
      <i class="icon-file-plus"></i>
      <span>Nueva factura</span>
    </a>
    <a onclick="abrirHistorialFacturas()" class="btn btn-lg btn-outline-secondary mb-2">
      <i class="icon-list"></i>
      <span>Listado de facturas</span>
    </a>
    <a onclick="showView('inicio')" class="btn btn-outline-primary btn-lg w-100 mt-2 d-flex align-items-center justify-content-center">
      <span>Volver al inicio</span>
      <i class="icon-24-outlined-other-location-home ms-2"></i>
    </a>
  </div>
</div>
