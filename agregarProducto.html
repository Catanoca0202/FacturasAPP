      function marcarCampo(id, esError) {
        const campo = document.getElementById(id);
        if (!campo) return;
        campo.style.backgroundColor = esError ? '#FFC7C7' : '';
      }

      function getSelectedRegimenCode() {
        const val = document.getElementById('regimen').value;
        return REGIMEN_VALUE_TO_CODE[val] || '';
      }

      function onRegimenChange() {
        const code = getSelectedRegimenCode();
        const tipoImpuesto = document.getElementById('tipoImpuesto').value;
        const config = getClientRegimenConfig(code, tipoImpuesto);
        const taxConfig = getClientTaxConfig(tipoImpuesto);
        const tarifaSelect = document.getElementById('tarifaImpuesto');
        const tarifaLibre = document.getElementById('tarifaImpuestoLibre');

        if (!config) {
          tarifaSelect.innerHTML = '';
          tarifaSelect.add(new Option('Selecciona régimen primero', ''));
          updateRecargoVisibility();
          actualizarOperacionExenta();
          return;
        }

        // Handle autoExento (régimen 02 = Exportación)
        if (config.autoExento) {
          const exentoCheck = document.getElementById('exento');
          if (!exentoCheck.checked) {
            exentoCheck.checked = true;
            onToggleExento({ target: exentoCheck });
          }
          // Hide IVA incluido on autoExento
          document.getElementById('ivaIncluidoContainer').style.display = 'none';
          document.getElementById('ivaIncluido').checked = false;
        }

        if (taxConfig.tarifaMode === 'freeform' || config.rates === null) {
          // Freeform: show the numeric input, hide the select dropdown
          tarifaSelect.style.display = 'none';
          tarifaSelect.removeAttribute('required');
          tarifaLibre.style.display = '';
          tarifaLibre.setAttribute('required', '');
          if (config.rates && config.rates.length === 1 && config.rates[0] === 0) {
            tarifaLibre.value = '0';
          }
        } else {
          // Dropdown mode
          tarifaSelect.style.display = '';
          tarifaSelect.setAttribute('required', '');
          tarifaLibre.style.display = 'none';
          tarifaLibre.removeAttribute('required');
          tarifaSelect.innerHTML = '';

          const soloExento = config.rates.length === 1 && config.rates[0] === 0;
          if (soloExento) {
            tarifaSelect.add(new Option('Exento (0%)', '0'));
            tarifaSelect.value = '0';
          } else {
            tarifaSelect.add(new Option('Selecciona una opción', ''));
            config.rates.forEach(function(rate) {
              const label = rate === 0 ? 'Exento (0%)' : rate + '%';
              tarifaSelect.add(new Option(label, String(rate)));
            });
          }
        }

        updateRecargoVisibility();
        actualizarOperacionExenta();
      }

      function onTarifaChange() {
        actualizarOperacionExenta();
      }

      function actualizarOperacionExenta() {
        const code = getSelectedRegimenCode();
        const tipoImpuesto = document.getElementById('tipoImpuesto').value;
        const config = getClientRegimenConfig(code, tipoImpuesto);
        const container = document.getElementById('operacionExentaContainer');
        const select = document.getElementById('operacionExenta');
        const valorPrevio = select.value;
        const isExento = document.getElementById('exento').checked;
        // Operación exenta is driven exclusively by the "Producto exento" checkbox,
        // never by a 0% tarifa.
        const showExenta = isExento && config && config.exentoOps && config.exentoOps.length > 0;

        if (showExenta) {
          select.innerHTML = '';
          select.add(new Option('Selecciona una opción', ''));
          config.exentoOps.forEach(function(op) {
            const label = OPERACION_EXENTA_LABELS_CLIENT[op] || op;
            select.add(new Option(label, label));
          });
          if (valorPrevio) {
            for (let i = 0; i < select.options.length; i++) {
              if (select.options[i].value === valorPrevio) { select.value = valorPrevio; break; }
            }
          }
          container.style.display = '';
        } else {
          // Hidden: also drop the value so a stale selection is never submitted
          select.innerHTML = '<option value="">Selecciona una opción</option>';
          select.value = '';
          container.style.display = 'none';
        }
      }

      function onTipoImpuestoChange() {
        const tipo = document.getElementById('tipoImpuesto').value;
        const selectTarifa = document.getElementById('tarifaImpuesto');
        const inputTarifa = document.getElementById('tarifaImpuestoLibre');
        const taxConfig = getClientTaxConfig(tipo);

        // Filter régimen options based on tax type
        const regimenSelect = document.getElementById('regimen');
        const prevRegimen = regimenSelect.value;
        regimenSelect.innerHTML = '<option value="">Selecciona una opción</option>';
        ALL_REGIMEN_OPTIONS.forEach(function(opt) {
          if (taxConfig.regimenes[opt.code]) {
            regimenSelect.add(new Option(opt.label, opt.value));
          }
        });
        // Restore previous selection if still valid
        if (prevRegimen) {
          var prevCode = REGIMEN_VALUE_TO_CODE[prevRegimen];
          if (prevCode && taxConfig.regimenes[prevCode]) {
            regimenSelect.value = prevRegimen;
          }
        }

        // Set tarifa mode based on tax type
        if (taxConfig.tarifaMode === 'freeform') {
          selectTarifa.style.display = 'none';
          selectTarifa.removeAttribute('required');
          inputTarifa.style.display = '';
          inputTarifa.setAttribute('required', '');
        } else {
          selectTarifa.style.display = '';
          selectTarifa.setAttribute('required', '');
          inputTarifa.style.display = 'none';
          inputTarifa.removeAttribute('required');
          inputTarifa.value = '';
        }

        // IVA incluido: only available for IVA tax type
        const ivaIncluidoContainer = document.getElementById('ivaIncluidoContainer');
        if (tipo === 'IVA') {
          ivaIncluidoContainer.style.display = '';
        } else {
          ivaIncluidoContainer.style.display = 'none';
          document.getElementById('ivaIncluido').checked = false;
          // Restore exento visibility when switching away from IVA
          document.getElementById('exentoContainer').style.display = '';
        }

        // Re-apply régimen-based rules
        onRegimenChange();
        onTarifaChange();
      }

      function onToggleExento(event) {
        const isExento = event.target.checked;
        const tarifaSelect = document.getElementById('tarifaImpuesto');
        const tarifaLibre = document.getElementById('tarifaImpuestoLibre');
        const calificacionContainer = document.getElementById('calificacionContainer');
        const tarifaContainer = tarifaSelect.closest('.col-6');
        const ivaIncluidoContainer = document.getElementById('ivaIncluidoContainer');

        if (isExento) {
          // Hide tarifa (both select + libre), hide calificación
          tarifaSelect.value = '0';
          tarifaLibre.value = '0';
          tarifaContainer.style.display = 'none';
          tarifaSelect.removeAttribute('required');
          tarifaLibre.removeAttribute('required');
          calificacionContainer.style.display = 'none';
          // Mutual exclusivity: hide + uncheck IVA incluido
          ivaIncluidoContainer.style.display = 'none';
          document.getElementById('ivaIncluido').checked = false;
        } else {
          // Restore tarifa and calificación
          tarifaContainer.style.display = '';
          const tipo = document.getElementById('tipoImpuesto').value;
          const taxCfg = getClientTaxConfig(tipo);
          if (taxCfg.tarifaMode === 'freeform') {
            tarifaLibre.setAttribute('required', '');
          } else {
            tarifaSelect.setAttribute('required', '');
          }
          calificacionContainer.style.display = '';
          // Show IVA incluido only for IVA
          if (tipo === 'IVA') {
            ivaIncluidoContainer.style.display = '';
          }
        }
        updateRecargoVisibility();
        actualizarOperacionExenta();
      }

      function onToggleIvaIncluido(event) {
        const isChecked = event.target.checked;
        const exentoContainer = document.getElementById('exentoContainer');
        if (isChecked) {
          // Mutual exclusivity: hide + uncheck exento
          exentoContainer.style.display = 'none';
          document.getElementById('exento').checked = false;
          // Restore non-exento UI state if needed
          const tarifaSelect = document.getElementById('tarifaImpuesto');
          const tarifaContainer = tarifaSelect.closest('.col-6');
          tarifaContainer.style.display = '';
          document.getElementById('calificacionContainer').style.display = '';
          updateRecargoVisibility();
          actualizarOperacionExenta();
        } else {
          exentoContainer.style.display = '';
        }
      }

      function verificarDatosObligatoriosProducto() {
        const camposObligatorios = [
          'codigoReferencia',
          'nombre',
          'regimen',
          'tipoProducto',
          'tipoUso',
          'valorUnitario',
          'tipoImpuesto'
        ];

        let isValid = true;
        const tipoImpuesto = document.getElementById('tipoImpuesto').value;
        const isFreeform = getClientTaxConfig(tipoImpuesto).tarifaMode === 'freeform';
        const isExento = document.getElementById('exento').checked;

        camposObligatorios.forEach(id => {
          const campo = document.getElementById(id);
          const valor = campo ? campo.value.trim() : '';
          const esCampoValido = Boolean(valor);
          marcarCampo(id, !esCampoValido);
          if (!esCampoValido) {
            isValid = false;
          }
        });

        // Validate tarifa: dropdown for IVA, free input for freeform types
        if (isFreeform) {
          const tarifaLibre = document.getElementById('tarifaImpuestoLibre').value;
          const tarifaNum = Number(tarifaLibre);
          if (tarifaLibre === '' || isNaN(tarifaNum) || tarifaNum < 0 || tarifaNum > 100) {
            marcarCampo('tarifaImpuestoLibre', true);
            isValid = false;
          } else {
            marcarCampo('tarifaImpuestoLibre', false);
          }
        } else if (!isExento) {
          const tarifaVal = document.getElementById('tarifaImpuesto').value.trim();
          if (!tarifaVal) {
            marcarCampo('tarifaImpuesto', true);
            isValid = false;
          } else {
            marcarCampo('tarifaImpuesto', false);
          }
        }

        const aplicarRetencion = document.getElementById('aplicarRetencion').checked;
        const retencionSel = document.getElementById('retenciones').value;
        if (aplicarRetencion && !retencionSel) {
          marcarCampo('retenciones', true);
          isValid = false;
        } else {
          marcarCampo('retenciones', false);
        }

        if (aplicarRetencion && retencionSel === RETENCION_OTROS_VALUE) {
          const porcentajeRet = document.getElementById('porcentajeRetencion').value;
          const porcentajeNum = Number(String(porcentajeRet).replace(',', '.'));
          const porcentajeValido = String(porcentajeRet).trim() !== '' && !isNaN(porcentajeNum) &&
            porcentajeNum >= RETENCION_OTROS_MIN && porcentajeNum <= RETENCION_OTROS_MAX &&
            tieneMaximoDosDecimales(porcentajeRet);
          marcarCampo('porcentajeRetencion', !porcentajeValido);
          if (!porcentajeValido) {
            isValid = false;
            mostrarAlerta('El % de retención debe estar entre ' + RETENCION_OTROS_MIN + ' y ' +
              RETENCION_OTROS_MAX + ', con máximo 2 decimales.');
          }
          const descripcionRet = document.getElementById('descripcionRetencion').value.trim();
          const descripcionLarga = descripcionRet.length > RETENCION_OTROS_DESCRIPCION_MAX;
          marcarCampo('descripcionRetencion', descripcionLarga);
          if (descripcionLarga) {
            isValid = false;
            mostrarAlerta('La descripción de la retención no puede superar ' + RETENCION_OTROS_DESCRIPCION_MAX + ' caracteres.');
          }
        } else {
          marcarCampo('porcentajeRetencion', false);
          marcarCampo('descripcionRetencion', false);
        }

        const code = getSelectedRegimenCode();
        const tipoImpuestoVal = document.getElementById('tipoImpuesto').value;
        const config = getClientRegimenConfig(code, tipoImpuestoVal);
        const taxCfg = getClientTaxConfig(tipoImpuestoVal);
        if (config && config.rates !== null && taxCfg.tarifaMode === 'dropdown') {
          const tarifaVal = Number(document.getElementById('tarifaImpuesto').value);
          if (config.rates.indexOf(tarifaVal) === -1 && !isExento) {
            marcarCampo('tarifaImpuesto', true);
            isValid = false;
            mostrarAlerta('La tarifa de ' + tipoImpuestoVal + ' seleccionada no es válida para el régimen ' + code + '.');
          }
        }

        // Mutual exclusivity: exento → require operación exenta; not exento → require calificación
        if (isExento) {
          if (config && config.exentoOps && config.exentoOps.length > 0) {
            const opExenta = document.getElementById('operacionExenta').value;
            if (!opExenta) {
              marcarCampo('operacionExenta', true);
              isValid = false;
            } else {
              marcarCampo('operacionExenta', false);
            }
          }
        } else {
          // Not exento: require calificación
          const califVal = document.getElementById('calificacionOperacion').value;
          if (!califVal) {
            marcarCampo('calificacionOperacion', true);
            isValid = false;
          } else {
            marcarCampo('calificacionOperacion', false);
          }
          // Not exento: operación exenta stays hidden, so it is never required
          marcarCampo('operacionExenta', false);
        }

        return isValid;
      }

      function submitForm() {
        if (verificarDatosObligatoriosProducto()) {
          const form = document.getElementById('productForm');
          form.dispatchEvent(new Event('submit'));
        } else {
          mostrarAlerta('Por favor complete todos los campos obligatorios.');
        }
      }

      function handleSubmit(event) {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);
        formData.set('aplicarRecargo', document.getElementById('aplicarRecargo').checked);
        // Retención independiente
        if (document.getElementById('aplicarRetencion').checked) {
          const esOtros = esRetencionOtrosSeleccionada();
          formData.set('retenciones', document.getElementById('retenciones').value);
          formData.set('porcentajeRetencion', esOtros ? document.getElementById('porcentajeRetencion').value : '');
          formData.set('descripcionRetencion', esOtros ? document.getElementById('descripcionRetencion').value.trim() : '');
        } else {
          formData.set('retenciones', '');
          formData.set('porcentajeRetencion', '');
          formData.set('descripcionRetencion', '');
        }
        formData.set('calificacionOperacion', document.getElementById('calificacionOperacion').value);
        formData.set('exento', document.getElementById('exento').checked);
        formData.set('ivaIncluido', document.getElementById('ivaIncluido').checked);
        // Freeform tax types: use the free input value
        const taxCfgSubmit = getClientTaxConfig(document.getElementById('tipoImpuesto').value);
        if (taxCfgSubmit.tarifaMode === 'freeform') {
          formData.set('tarifaImpuesto', document.getElementById('tarifaImpuestoLibre').value);
        }

        const data = {};
        formData.forEach((value, key) => {
          data[key] = value;
        });

        google.script.run.withSuccessHandler(function () {
          resetForm();
        }).processForm(data);
      }

      function resetForm() {
        const form = document.getElementById('productForm');
        form.reset();
        ['codigoReferencia','nombre','regimen','tipoProducto','tipoUso','valorUnitario','tipoImpuesto','tarifaImpuesto','operacionExenta','retenciones','porcentajeRetencion','descripcionRetencion']
          .forEach(id => marcarCampo(id, false));
        document.getElementById('aplicarRecargo').checked = false;
        document.getElementById('aplicarRetencion').checked = false;
        document.getElementById('exento').checked = false;
        document.getElementById('ivaIncluido').checked = false;
        document.getElementById('exentoContainer').style.display = '';
        document.getElementById('ivaIncluidoContainer').style.display = '';
        document.getElementById('calificacionContainer').style.display = '';
        document.getElementById('calificacionOperacion').value = 'S1';
        document.getElementById('operacionExentaContainer').style.display = 'none';
        document.getElementById('operacionExenta').innerHTML = '<option value="">Selecciona una opción</option>';
        const tarifaSelect = document.getElementById('tarifaImpuesto');
        tarifaSelect.innerHTML = '<option value="">Selecciona régimen primero</option>';
        tarifaSelect.style.display = '';
        tarifaSelect.disabled = false;
        document.getElementById('tarifaImpuestoLibre').style.display = 'none';
        document.getElementById('tarifaImpuestoLibre').value = '';
        document.getElementById('tarifaImpuestoLibre').disabled = false;
        document.getElementById('tipoImpuesto').value = 'IVA';
        updateRecargoVisibility();
        renderRetencion(false);
        document.getElementById('nombre').focus();
      }

      function showPreProducto() {
        google.script.run.showPreProductos();
      }

      function showMenuPrincipal() {
        google.script.run.showSidebar();
      }

      function obtenerTarifaRecargoActual() {
        const iva = document.getElementById('tarifaImpuesto').value;
        return IVA_RECARGO_2025[iva] || '';
      }

      function renderRetencion(activa) {
        const select = document.getElementById('retenciones');
        select.innerHTML = '';
        if (activa) {
          TARIFAS_RETENCION.forEach(op => select.add(new Option(op.label, op.value)));
          select.disabled = false;
        } else {
          select.disabled = true;
          select.value = '';
        }
        updateRetencionOtrosVisibility();
      }

      function esRetencionOtrosSeleccionada() {
        return document.getElementById('retenciones').value === RETENCION_OTROS_VALUE;
      }

      // RFC 466 caps the manual rate at 2 decimals
      function tieneMaximoDosDecimales(valor) {
        const decimales = String(valor).replace(',', '.').split('.')[1];
        return !decimales || decimales.length <= 2;
      }

      function updateRetencionOtrosVisibility() {
        const select = document.getElementById('retenciones');
        const mostrar = !select.disabled && esRetencionOtrosSeleccionada();
        document.getElementById('porcentajeRetencionContainer').style.display = mostrar ? '' : 'none';
        document.getElementById('descripcionRetencionContainer').style.display = mostrar ? '' : 'none';
        if (!mostrar) {
          document.getElementById('porcentajeRetencion').value = '';
          document.getElementById('descripcionRetencion').value = '';
          marcarCampo('porcentajeRetencion', false);
          marcarCampo('descripcionRetencion', false);
        }
      }

      function onTarifaRetencionChange() {
        updateRetencionOtrosVisibility();
      }

      function onTarifaImpuestoChange() {
        actualizarOperacionExenta();
      }

      // Recargo de equivalencia is only offered when every rule allows it:
      // sale of a product, a régimen that permits it (e.g. 08 never does),
      // not exento and a calificación that is not forced to 0%.
      function puedeAplicarRecargo() {
        const tipoProducto = document.getElementById('tipoProducto').value;
        const tipoUso = document.getElementById('tipoUso').value;
        if (tipoProducto !== 'Producto' || tipoUso !== 'Venta') return false;
        if (document.getElementById('exento').checked) return false;
        const calificacion = document.getElementById('calificacionOperacion').value;
        if (['S2', 'N1', 'N2'].includes(calificacion)) return false;
        const config = getClientRegimenConfig(getSelectedRegimenCode(), document.getElementById('tipoImpuesto').value);
        // Fail closed: an unknown or empty regimen never allows recargo
        // (same criterion as isRecargoAllowed in mainScript.js).
        if (!config || !config.allowRecargo) return false;
        return true;
      }

      function updateRecargoVisibility() {
        const recargoContainer = document.getElementById('recargoContainer');
        const recargoCheckbox = document.getElementById('aplicarRecargo');
        if (puedeAplicarRecargo()) {
          recargoContainer.style.display = '';
        } else {
          recargoContainer.style.display = 'none';
          recargoCheckbox.checked = false;
        }
      }

      function onToggleRecargo(event) {
        // recargo independiente, no afecta retención
      }

      function onToggleRetencion(event) {
        renderRetencion(event.target.checked);
      }

      function onCalificacionChange() {
        const califVal = document.getElementById('calificacionOperacion').value;
        if (['S2', 'N1', 'N2'].includes(califVal)) {
          // Force tarifa to 0%
          document.getElementById('tarifaImpuesto').value = '0';
          document.getElementById('tarifaImpuestoLibre').value = '0';
        } else if (califVal === 'S1') {
          // Re-apply tarifa based on régimen
          onRegimenChange();
        }
        updateRecargoVisibility();
        actualizarOperacionExenta();
      }

      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('tarifaImpuesto').addEventListener('change', onTarifaImpuestoChange);
        document.getElementById('aplicarRecargo').addEventListener('change', onToggleRecargo);
        document.getElementById('aplicarRetencion').addEventListener('change', onToggleRetencion);
        document.getElementById('retenciones').addEventListener('change', onTarifaRetencionChange);
        document.getElementById('calificacionOperacion').addEventListener('change', onCalificacionChange);
        renderRetencion(false);
        // Initialize régimen options for default tax type (IVA)
        onTipoImpuestoChange();
        updateRecargoVisibility();
      });
    </script>
  </head>

  <body class="d-flex h-100">
    <div class="assistant-container d-flex w-100 h-100 mx-auto flex-column">
      <header class="mb-auto">
        <div id="logo" class="d-flex justify-content-center bg-primary">
          <img src="https://facturasapp-qa.cenet.ws/Publico/google-sheets-resources/images/logoAssistant.png" alt="">
        </div>

        <div class="mt-4 px-4 gx-0 d-flex justify-content-between align-items-center">
          <!-- <a href="#"  onclick="showMenuPrincipal()" class="btn btn-outline-secondary btn-fluid"><i class="icon-left"></i> <span>Regresar</span></a> -->

          <a 
          onclick="showPreProducto()" 
          href="#" 
          class="btn btn-outline-secondary btn-sm me-2"
          style="min-width: 120px;"
        >
          <i class="icon-left"></i>
          <span class="ms-1">Regresar</span>
        </a>
        <a
        onclick="abrirSoporte()"
        href="#"
        class="btn btn-outline-secondary btn-sm d-flex align-items-center justify-content-center"
        style="width: 40px; height: 40px;"
        data-bs-toggle="tooltip" 
        data-bs-placement="top" 
        title="Soporte" 
      >
        <i class="icon-info"></i>
      </a>

        

</div>
<div class="mt-2 px-4 gx-0 d-flex flex-column">
 <h2 class="mt-1">Crear producto</h2>
</div>
      </header>

      <main>
        <div class="row py-3 px-4 mt-3 gx-0">
          <div class="col-12 py-4">
            <p>Ingresa la información de tu nuevo producto.</p>
          </div>

          <div class="col-12 px-0">
            <form class="row g-3" onsubmit="handleSubmit(event)" id="productForm">
              <div class="col-12">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control form-control-lg" id="nombre" name="nombre" required>
              </div>

              <div class="col-12">
                <label for="regimen" class="form-label">Régimen</label>
                <select id="regimen" name="regimen" class="form-select form-select-lg" required onchange="onRegimenChange()">
                  <option value="">Selecciona una opción</option>
                  <option value="Operación de régimen general">01 - Operación de régimen general</option>
                  <option value="Exportación">02 - Exportación</option>
                  <option value="Régimen especial del oro de inversión">04 - Régimen especial oro de inversión</option>
                  <option value="Régimen especial del criterio de caja">07 - Régimen especial criterio de caja</option>
                  <option value="Operaciones sujetas al IPSI / IGIC (Impuesto sobre la Producción, los Servicios y la Importación / Impuesto General Indirecto Canario)">08 - Operaciones sujetas al IPSI / IGIC</option>
                  <option value="Cobros por cuenta de terceros de honorarios profesionales o de derechos derivados de la propiedad industrial, de autor u otros por cuenta de sus socios, asociados o colegiados efectuados por sociedades, asociaciones, colegios profesionales u otras entidades que realicen estas funciones de cobro">10 - Cobros por cuenta de terceros</option>
                  <option value="Operaciones de arrendamiento de local de negocio">11 - Arrendamiento de local de negocio</option>
                  <option value="Factura con IVA pendiente de devengo en certificaciones de obra cuyo destinatario sea una Administración Pública">14 - IVA pendiente devengo certificaciones obra</option>
                  <option value="Factura con IVA pendiente de devengo en operaciones de tracto sucesivo">15 - IVA pendiente de devengo tracto sucesivo</option>
                  <option value="Operación acogida a alguno de los regímenes previstos en el Capítulo XI del Título IX (OSS e IOSS)">17 - OSS e IOSS</option>
                  <option value="Recargo de equivalencia">18 - Recargo de equivalencia</option>
                  <option value="Operaciones de actividades incluidas en el Régimen Especial de Agricultura, Ganadería y Pesca (REAGYP)">19 - REAGYP</option>
                  <option value="Régimen simplificado">20 - Régimen simplificado</option>
                  <option value="Régimen especial (pendiente confirmación con negocio)">21 - Régimen especial (pendiente confirmación)</option>
                </select>
              </div>

              <div class="col-6">
                <label for="tipoProducto" class="form-label">Tipo producto</label>
                <select id="tipoProducto" name="tipoProducto" class="form-select form-select-lg" required onchange="updateRecargoVisibility()">
                  <option value="">Selecciona una opción</option>
                  <option value="Producto">Producto</option>
                  <option value="Servicio">Servicio</option>
                </select>
              </div>

              <div class="col-6">
                <label for="tipoUso" class="form-label">Tipo de uso</label>
                <select id="tipoUso" name="tipoUso" class="form-select form-select-lg" required onchange="updateRecargoVisibility()">
                  <option value="">Selecciona una opción</option>
                  <option value="Venta">Venta</option>
                  <option value="Compra">Compra</option>
                </select>
              </div>

              <div class="col-6">
                <label for="valorUnitario" class="form-label">Valor unitario</label>
                <input type="number" class="form-control form-control-lg" id="valorUnitario" name="valorUnitario" required step=".01">
              </div>

              <div class="col-6">
                <label for="codigoReferencia" class="form-label">Código referencia</label>
                <input type="text" class="form-control form-control-lg" id="codigoReferencia" name="codigoReferencia" required>
              </div>

              <div class="col-6">
                <label for="tipoImpuesto" class="form-label">Tipo de impuesto</label>
                <select id="tipoImpuesto" name="tipoImpuesto" class="form-select form-select-lg" required onchange="onTipoImpuestoChange()">
                  <option value="IVA">IVA</option>
                  <option value="IPSI">IPSI</option>
                  <option value="IGIC">IGIC</option>
                  <option value="Otros">Otros</option>
                </select>
              </div>

              <div class="col-6">
                <label for="tarifaImpuesto" class="form-label">Tarifa impuesto</label>
                <select id="tarifaImpuesto" name="tarifaImpuesto" class="form-select form-select-lg" required onchange="onTarifaChange()">
                  <option value="">Selecciona régimen primero</option>
                </select>
                <input type="number" class="form-control form-control-lg" id="tarifaImpuestoLibre"
                  min="0" max="100" step="0.01" placeholder="0-100%" style="display:none" onchange="onTarifaChange()">
              </div>

              <div class="col-12" id="operacionExentaContainer" style="display:none">
                <label for="operacionExenta" class="form-label">Operación exenta</label>
                <select id="operacionExenta" name="operacionExenta" class="form-select form-select-lg">
                  <option value="">Selecciona una opción</option>
                </select>
              </div>

              <div class="col-6" id="calificacionContainer">
                <label for="calificacionOperacion" class="form-label">Calificación operación</label>
                <select id="calificacionOperacion" name="calificacionOperacion" class="form-select form-select-lg">
                  <option value="S1" selected>S1 - No exenta, sin inversión suj. pasivo</option>
                  <option value="S2">S2 - No exenta, con inversión suj. pasivo</option>
                  <option value="N1">N1 - No sujeta, art. 7/14/otros</option>
                  <option value="N2">N2 - No sujeta, por reglas de localización</option>
                </select>
              </div>

              <div class="col-6">
                <div class="form-check mt-4" id="exentoContainer">
                  <input class="form-check-input" type="checkbox" id="exento" name="exento" onchange="onToggleExento(event)">
                  <label class="form-check-label" for="exento">
                    Producto exento
                  </label>
                </div>
                <div class="form-check mt-1" id="ivaIncluidoContainer">
                  <input class="form-check-input" type="checkbox" id="ivaIncluido" name="ivaIncluido" onchange="onToggleIvaIncluido(event)">
                  <label class="form-check-label" for="ivaIncluido">
                    IVA incluido
                  </label>
                </div>
              </div>

              <div class="col-12" id="recargoContainer">
                <div class="form-check mt-2">
                  <input class="form-check-input" type="checkbox" id="aplicarRecargo" name="aplicarRecargo">
                  <label class="form-check-label" for="aplicarRecargo">
                    Aplicar recargo de equivalencia automático
                  </label>
                </div>
              </div>

              <div class="col-6">
                <div class="form-check mt-2">
                  <input class="form-check-input" type="checkbox" id="aplicarRetencion" name="aplicarRetencion">
                  <label class="form-check-label" for="aplicarRetencion">
                    Aplicar retención (7%, 15%, 19% u Otros)
                  </label>
                </div>
              </div>
              <div class="col-6">
                <label for="retenciones" class="form-label">Tarifa retención</label>
                <select id="retenciones" name="retenciones" class="form-select form-select-lg" disabled>
                  <option value="">Selecciona una opción</option>
                </select>
              </div>
              <div class="col-6" id="porcentajeRetencionContainer" style="display:none">
                <label for="porcentajeRetencion" class="form-label">% Retención</label>
                <input type="number" id="porcentajeRetencion" name="porcentajeRetencion" class="form-control form-control-lg"
                       min="0" max="100" step="0.01" placeholder="0,00">
              </div>
              <div class="col-12" id="descripcionRetencionContainer" style="display:none">
                <label for="descripcionRetencion" class="form-label">Descripción (opcional)</label>
                <input type="text" id="descripcionRetencion" name="descripcionRetencion" class="form-control form-control-lg" maxlength="50">
              </div>

            </form>
          </div>
        </div>
      </main>


      <footer class="mt-auto">
        <div class="row p-4 gx-0">
          <div class="col-6 pe-1">
            <a href="#" onclick="showMenuPrincipal()" class="btn btn-outline-primary btn-lg w-100 btn-menu">
              <span class="">Inicio</span>
              <i class="icon-24-outlined-other-location-home"style="font-size: 20px;"></i>
            </a>
          </div>
          <div class="col-6 ps-1">
            <a href="#" onclick="submitForm()" class="btn btn-primary btn-lg w-100 btn-menu">
              <span class="">Guardar</span>
              <i class="icon-24-outlined-editor-action-save"style="font-size: 18px;"></i>
            </a>
          </div>
        </div>
      </footer>


    </div>
  </body>
</html>
