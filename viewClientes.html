<div class="row py-3 px-4 gx-0">
  <div class="col-12 py-4">
    <h2 class="mt-1">Clientes</h2>
    <p>Crea, guarda y visualiza tus contactos en Google Sheets <sup>™</sup>.</p>
  </div>

  <div class="col-12 mt-4 px-0">
    <div class="row">
      <div class="col-12">
        <a onclick="clientesMostrarCrear()" class="btn btn-secondary btn-lg w-100">
          <i class="icon-24-outlined-other-person-user-plus me-0"></i>
          <span>Crear <br>contacto</span>
        </a>
      </div>
    </div>
  </div>

  <div class="col-12 mt-4 px-0">
    <a onclick="showView('inicio')" class="btn btn-outline-primary btn-lg w-100 d-flex align-items-center justify-content-center btn-menu">
      <span>Inicio</span>
      <i class="icon-24-outlined-other-location-home ms-2"></i>
    </a>
  </div>
</div>

<script>
  function clientesMostrarCrear() {
    // Asegurar que estamos en la hoja Clientes y mostrar la vista de creación
    google.script.run.openClientesSheet();
    showView('clienteCrear');
  }
</script>
