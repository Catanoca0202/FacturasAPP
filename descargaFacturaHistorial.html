<!doctype html>
<html lang="en" class="h-100">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Descargar Factura</title>

    <!-- Bootstrap core CSS -->
    <link href="https://facturasapp.com/Publico/google-sheets-resources/css/bootstrap.css" rel="stylesheet">

    <!-- Custom styles for this template -->
    <link href="https://facturasapp.com/Publico/google-sheets-resources/css/custom.css" rel="stylesheet">
    <link href="https://facturasapp.com/Publico/google-sheets-resources/css/fontello-codes.css" rel="stylesheet">
  </head>
  <script>
      function abrirSoporte() {
  
        window.open('https://soporte.facturasapp.com/hc/es-es/articles/34324157226907-Canales-de-Atenci%C3%B3n')
      }
    function OpenEnviarEmail(){
      const numFacutra=document.getElementById("numFactura").value
      if (!numFacutra) {
              mostrarAlerta("Por favor, ingresa un código de factura válido.");
              return;
          }
      localStorage.setItem("numFactura", numFacutra);
      google.script.run.showEnviarEmailPostHistorial();
    }
    // y que pasa si  no existe el numero de la factura ?
      function mostrarAlerta(mensaje) {
          google.script.run.mostrarAlertaDesdeServidor(mensaje);
      }

    function handleSubmit() {
          // Obtén el valor del campo directamente
          const numFactura = document.getElementById('numFactura').value;

          if (!numFactura) {
              mostrarAlerta("Por favor, ingresa un código de factura válido.");
              return;
          }

          const data = { numFactura };

          google.script.run
              .withSuccessHandler(function (url) {
                  if (!url || (typeof url === 'string' && (url === 'Factura no encontrada en el historial' || url === 'Factura no encontrada' || url.indexOf('no encontrada') !== -1 || url.indexOf('Error') === 0))) {
                      mostrarAlerta('No se encontró la factura en el historial. Verifica el consecutivo ingresado.');
                      return;
                  }
                  const link = document.createElement('a');
                  link.href = url;
                  link.download = 'Factura_' + data.numFactura + '.pdf';
                  link.click();
              })
              .ProcesarFormularioFactura(data);
      }
      function back(){
        google.script.run.showSidebar()
      }

      function enviarFacturasApp(){
        const numFactura = document.getElementById('numFactura').value;
        if (!numFactura) {
              mostrarAlerta("Por favor, ingresa un código de factura válido.");
              return;
          }else{
            google.script.run.enviarFacturaHistorial(numFactura)
          }
        
      }

      function escapeHtml(texto) {
        const div = document.createElement('div');
        div.textContent = texto == null ? '' : String(texto);
        return div.innerHTML;
      }

      function setCargando(cargando, texto) {
        document.getElementById('estadoCargando').style.display = cargando ? '' : 'none';
        document.getElementById('estadoCargandoTexto').textContent = texto || '';
        document.querySelectorAll('.btn-estado').forEach(btn => { btn.disabled = cargando; });
      }

      function mostrarResultadoEstado(html) {
        const panel = document.getElementById('resultadoEstado');
        panel.innerHTML = html;
        panel.style.display = html ? '' : 'none';
      }

      function consultarEstado() {
        const numFactura = document.getElementById('numFactura').value.trim();
        if (!numFactura) {
          mostrarAlerta("Por favor, ingresa un código de factura válido.");
          return;
        }
        mostrarResultadoEstado('');
        setCargando(true, 'Consultando estado…');
        google.script.run
          .withSuccessHandler(function (res) {
            setCargando(false);
            if (!res || !res.ok) {
              mostrarResultadoEstado('<div class="alert alert-danger mb-0">' +
                escapeHtml(res && res.error ? res.error : 'No se pudo consultar el estado.') + '</div>');
              return;
            }
            let html = '<div class="alert alert-light border mb-0">' +
              '<p class="mb-1"><strong>Factura:</strong> ' + escapeHtml(res.numero) + '</p>' +
              '<p class="mb-1"><strong>Estado:</strong> ' + escapeHtml(res.estado) + '</p>';
            if (res.descripcion) {
              html += '<p class="mb-1 small text-muted">' + escapeHtml(res.descripcion) + '</p>';
            }
            if (res.errores && res.errores.length) {
              html += '<p class="mb-1 mt-2"><strong>Errores de rechazo VeriFactu:</strong></p><ul class="small mb-1 ps-3">';
              res.errores.forEach(function (e) {
                html += '<li><strong>' + escapeHtml(e.codigoError) + '</strong> ' + escapeHtml(e.descripcion) + '</li>';
              });
              html += '</ul>';
            }
            if (res.error) {
              html += '<p class="mb-1 small text-danger">' + escapeHtml(res.error) + '</p>';
            }
            if (res.agencyUrl && /^https?:\/\//i.test(res.agencyUrl)) {
              html += '<a href="' + escapeHtml(res.agencyUrl) + '" target="_blank" rel="noopener" class="small">Ver en la Agencia Tributaria</a>';
            }
            html += '</div>';
            mostrarResultadoEstado(html);
          })
          .withFailureHandler(function (err) {
            setCargando(false);
            mostrarResultadoEstado('<div class="alert alert-danger mb-0">' + escapeHtml(err && err.message ? err.message : err) + '</div>');
          })
          .consultarEstadoFactura(numFactura);
      }

      function actualizarEstados() {
        mostrarResultadoEstado('');
        setCargando(true, 'Actualizando estados del historial…');
        google.script.run
          .withSuccessHandler(function (res) {
            setCargando(false);
            const clase = res && res.tipo === 'error' ? 'alert-danger' : 'alert-success';
            mostrarResultadoEstado('<div class="alert ' + clase + ' mb-0">' + escapeHtml(res ? res.mensaje : '') + '</div>');
          })
          .withFailureHandler(function (err) {
            setCargando(false);
            mostrarResultadoEstado('<div class="alert alert-danger mb-0">' + escapeHtml(err && err.message ? err.message : err) + '</div>');
          })
          .actualizarEstadosHistorial();
      }
  </script>
  <body class="d-flex h-100">
    <div class="assistant-container d-flex w-100 h-100 mx-auto flex-column">
      <header class="mb-auto">
        <div id="logo" class="d-flex justify-content-center bg-primary">
          <img src="https://facturasapp-qa.cenet.ws/Publico/google-sheets-resources/images/logoAssistant.png" alt="">
        </div>
        <div class="mt-4 px-4 gx-0 d-flex justify-content-between align-items-center">
          <!-- <a href="#"  onclick="showMenuPrincipal()" class="btn btn-outline-secondary btn-fluid"><i class="icon-left"></i> <span>Regresar</span></a> -->

          <a 
          onclick="back()" 
          href="#" 
          class="btn btn-outline-secondary btn-sm me-2"
          style="min-width: 120px;"
        >
          <i class="icon-left"></i>
          <span class="ms-1">Regresar</span>
        </a>
        <a
        onclick="abrirSoporte()"
        href="#"
        class="btn btn-outline-secondary btn-sm d-flex align-items-center justify-content-center"
        style="width: 40px; height: 40px;"
        data-bs-toggle="tooltip" 
        data-bs-placement="top" 
        title="Soporte" 
      >
        <i class="icon-info"></i>
      </a>

        

</div>
<div class="mt-2 px-4 gx-0 d-flex flex-column">
 <h2 class="mt-1">Descargar</h2>
</div>
      </header>

      <main class="d-flex flex-column align-items-center justify-content-center flex-grow-1">
        <div class="row py-3 px-4 gx-0 w-100">
          <div class="col-12 py-4">
            <p class="fs-6">Ingresa el número de la factura la cual deseas descargar, enviar o consultar su estado.</p>
          </div>
          <div class="col-12 px-0">
            <form class="row g-3 d-flex flex-column align-items-center">
              <div class="col-12 mb-3 w-100">
                <label for="numFactura" class="form-label">Número de Factura</label>
                <input type="text" id="numFactura" class="form-control text-center" name="numFactura" required>
              </div>
              <div class="col-12">
                <button type="button" class="btn btn-primary btn-lg w-100 btn-menu" onclick="handleSubmit()">
                  <span class="pe-4">Descargar</span>
                  
                </button>
              </div>
              <div class="col-12 ">
                <button type="button" class="btn btn-primary btn-lg w-100 btn-menu" onclick="OpenEnviarEmail()">
                  <span class="pe-4">Envío por email</span>
                  
                </button>
              </div>
              <div class="col-12">
                <button type="button" class="btn btn-primary btn-lg w-100 btn-menu btn-estado" onclick="consultarEstado()">
                  <span class="pe-4">Consultar estado</span>
                </button>
              </div>
              <div class="col-12">
                <button type="button" class="btn btn-outline-primary btn-lg w-100 btn-menu btn-estado" onclick="actualizarEstados()">
                  <span class="pe-4">Actualizar estados del historial</span>
                </button>
              </div>
              <div class="col-12 text-center" id="estadoCargando" style="display: none;">
                <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                <span class="ms-2 small" id="estadoCargandoTexto"></span>
              </div>
              <div class="col-12" id="resultadoEstado" style="display: none;"></div>
              <!-- <div class="col-12">
                <button type="button" class="btn btn-primary btn-lg w-100 btn-menu" onclick="enviarFacturasApp()">
                  <span class="pe-4">Envío a FacturasApp</span>
                  
                </button>
              </div> -->
            </form>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
