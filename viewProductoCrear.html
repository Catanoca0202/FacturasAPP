<div class="row py-3 px-4 mt-3 gx-0">
  <div class="col-12 py-4">
    <h2 class="mt-1">Crear producto</h2>
    <p>Ingresa la información de tu nuevo producto.</p>
  </div>

  <div class="col-12 px-0">
    <form class="row g-3" onsubmit="handleSubmitProducto(event)" id="productForm">
      <div class="col-6">
        <label for="tipoProducto" class="form-label">Tipo producto</label>
        <select id="tipoProducto" name="tipoProducto" class="form-select form-select-lg" required onchange="updateRecargoVisibility()">
          <option value="">Selecciona una opción</option>
          <option value="Producto">Producto</option>
          <option value="Servicio">Servicio</option>
        </select>
      </div>

      <div class="col-6">
        <label for="tipoUso" class="form-label">Tipo de uso</label>
        <select id="tipoUso" name="tipoUso" class="form-select form-select-lg" required onchange="updateRecargoVisibility()">
          <option value="">Selecciona una opción</option>
          <option value="Venta">Venta</option>
          <option value="Compra">Compra</option>
        </select>
      </div>

      <div class="col-12">
        <label for="codigoReferencia" class="form-label">Código referencia</label>
        <input type="text" class="form-control form-control-lg" id="codigoReferencia" name="codigoReferencia" required>
      </div>

      <div class="col-12">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control form-control-lg" id="nombre" name="nombre" required>
      </div>

      <div class="col-6">
        <label for="valorUnitario" class="form-label">Valor unitario</label>
        <input type="number" class="form-control form-control-lg" id="valorUnitario" name="valorUnitario" required step=".01">
      </div>

      <div class="col-6">
        <div class="form-check mt-4" id="recargoContainer">
          <input class="form-check-input" type="checkbox" id="aplicarRecargo" name="aplicarRecargo" onchange="onToggleRecargo(event)">
          <label class="form-check-label" for="aplicarRecargo">
            Aplica recargo equivalencia
          </label>
        </div>
      </div>

      <div class="col-6">
        <label for="tipoImpuesto" class="form-label">Tipo de impuesto</label>
        <select id="tipoImpuesto" name="tipoImpuesto" class="form-select form-select-lg" required onchange="onTipoImpuestoChange()">
          <option value="IVA">IVA</option>
          <option value="IPSI">IPSI</option>
          <option value="IGIC">IGIC</option>
          <option value="Otros">Otros</option>
        </select>
      </div>

      <div class="col-6">
        <label for="regimen" class="form-label">Régimen</label>
        <select id="regimen" name="regimen" class="form-select form-select-lg" required onchange="onRegimenChange()">
          <option value="">Selecciona una opción</option>
          <option value="Operación de régimen general">01 - Operación de régimen general</option>
          <option value="Exportación">02 - Exportación</option>
          <option value="Régimen especial del oro de inversión">04 - Régimen especial oro de inversión</option>
          <option value="Régimen especial del criterio de caja">07 - Régimen especial criterio de caja</option>
          <option value="Operaciones sujetas al IPSI / IGIC (Impuesto sobre la Producción, los Servicios y la Importación / Impuesto General Indirecto Canario)">08 - Operaciones sujetas al IPSI / IGIC</option>
          <option value="Cobros por cuenta de terceros de honorarios profesionales o de derechos derivados de la propiedad industrial, de autor u otros por cuenta de sus socios, asociados o colegiados efectuados por sociedades, asociaciones, colegios profesionales u otras entidades que realicen estas funciones de cobro">10 - Cobros por cuenta de terceros</option>
          <option value="Operaciones de arrendamiento de local de negocio">11 - Arrendamiento de local de negocio</option>
          <option value="Factura con IVA pendiente de devengo en certificaciones de obra cuyo destinatario sea una Administración Pública">14 - IVA pendiente devengo certificaciones obra</option>
          <option value="Factura con IVA pendiente de devengo en operaciones de tracto sucesivo">15 - IVA pendiente de devengo tracto sucesivo</option>
          <option value="Operación acogida a alguno de los regímenes previstos en el Capítulo XI del Título IX (OSS e IOSS)">17 - OSS e IOSS</option>
          <option value="Recargo de equivalencia">18 - Recargo de equivalencia</option>
          <option value="Operaciones de actividades incluidas en el Régimen Especial de Agricultura, Ganadería y Pesca (REAGYP)">19 - REAGYP</option>
          <option value="Régimen simplificado">20 - Régimen simplificado</option>
          <option value="Régimen especial (pendiente confirmación con negocio)">21 - Régimen especial (pendiente confirmación)</option>
        </select>
      </div>

      <div class="col-6">
        <div class="form-check mt-4" id="exentoContainer">
          <input class="form-check-input" type="checkbox" id="exento" name="exento" onchange="onToggleExento(event)">
          <label class="form-check-label" for="exento">
            Producto exento
          </label>
        </div>
        <div class="form-check mt-1" id="ivaIncluidoContainer">
          <input class="form-check-input" type="checkbox" id="ivaIncluido" name="ivaIncluido" onchange="onToggleIvaIncluido(event)">
          <label class="form-check-label" for="ivaIncluido">
            IVA incluido
          </label>
        </div>
      </div>

      <div class="col-6">
        <label for="tarifaImpuesto" class="form-label">Tarifa impuesto</label>
        <select id="tarifaImpuesto" name="tarifaImpuesto" class="form-select form-select-lg" required onchange="onTarifaChange()">
          <option value="">Selecciona régimen primero</option>
        </select>
        <input type="number" class="form-control form-control-lg" id="tarifaImpuestoLibre"
          min="0" max="100" step="0.01" placeholder="0-100%" style="display:none" onchange="onTarifaChange()">
      </div>

      <div class="col-6" id="calificacionContainer">
        <label for="calificacionOperacion" class="form-label">Calificación operación</label>
        <select id="calificacionOperacion" name="calificacionOperacion" class="form-select form-select-lg">
          <option value="S1" selected>S1 - No exenta, sin inversión suj. pasivo</option>
          <option value="S2">S2 - No exenta, con inversión suj. pasivo</option>
          <option value="N1">N1 - No sujeta, art. 7/14/otros</option>
          <option value="N2">N2 - No sujeta, por reglas de localización</option>
        </select>
      </div>

      <div class="col-6" id="tarifaRecargoContainer" style="display:none">
        <label for="tarifaRecargo" class="form-label">Tarifa recargo equivalencia</label>
        <select id="tarifaRecargo" name="tarifaRecargo" class="form-select form-select-lg">
          <option value="">Selecciona una opción</option>
        </select>
      </div>

      <div class="col-12" id="operacionExentaContainer" style="display:none">
        <label for="operacionExenta" class="form-label">Operación exenta</label>
        <select id="operacionExenta" name="operacionExenta" class="form-select form-select-lg">
          <option value="">Selecciona una opción</option>
        </select>
      </div>

      <div class="col-6">
        <div class="form-check mt-2">
          <input class="form-check-input" type="checkbox" id="aplicarRetencion" name="aplicarRetencion" onchange="onToggleRetencion(event)">
          <label class="form-check-label" for="aplicarRetencion">
            Aplicar retención (7%, 15% o 19%)
          </label>
        </div>
      </div>
      <div class="col-6">
        <label for="retenciones" class="form-label">Tarifa retención</label>
        <select id="retenciones" name="retenciones" class="form-select form-select-lg" disabled>
          <option value="">Selecciona una opción</option>
        </select>
      </div>
    </form>
  </div>

  <div class="col-12 mt-4 px-0 d-flex justify-content-between">
    <a href="#" onclick="showView('productos')" class="btn btn-outline-secondary btn-lg">
      <i class="icon-left"></i>
      <span class="ms-1">Regresar</span>
    </a>
    <a href="#" onclick="submitFormProducto()" class="btn btn-primary btn-lg">
      <span class="">Guardar</span>
      <i class="icon-24-outlined-editor-action-save" style="font-size: 18px;"></i>
    </a>
  </div>
</div>

        '15': { rates: null, allowRecargo: true, exentoOps: ['E1','E2','E3','E4','E5','E6','E7','E8'] },
        '17': { rates: null, allowRecargo: true, exentoOps: ['E1','E2','E3','E4','E5','E6','E7','E8'] },

        '19': { rates: null, allowRecargo: true, exentoOps: ['E1','E2','E3','E4','E5','E6'] },
        '20': { rates: null, allowRecargo: true, exentoOps: ['E1','E2','E3','E4','E5','E6'] }
      },
      tarifaMode: 'freeform'
    },
    Otros: {
      regimenes: {
        '01': { rates: null, allowRecargo: true, exentoOps: ['E1','E2','E3','E4','E5','E6'] },
        '02': { rates: [0], allowRecargo: false, exentoOps: ['E1','E2','E3','E4','E5','E6'], autoExento: true },
        '04': { rates: [0], allowRecargo: false, exentoOps: ['E1','E2','E3','E4','E5','E6'] },

        '08': { rates: null, allowRecargo: false, exentoOps: ['E1','E2','E3','E4','E5','E6'] },
        '10': { rates: null, allowRecargo: true, exentoOps: ['E1','E2','E3','E4','E5','E6'] },
        '11': { rates: null, allowRecargo: false, exentoOps: [] },
        '14': { rates: null, allowRecargo: true, exentoOps: ['E1','E2','E3','E4','E5','E6'] },
        '15': { rates: null, allowRecargo: true, exentoOps: ['E1','E2','E3','E4','E5','E6'] },
        '17': { rates: null, allowRecargo: true, exentoOps: ['E1','E2','E3','E4','E5','E6'] },

      },
      tarifaMode: 'freeform'
    }

  // All régimen options with their codes, for filtering by tax type
  var ALL_REGIMEN_OPTIONS = [
    { code: '01', value: 'Operación de régimen general', label: '01 - Operación de régimen general' },
    { code: '02', value: 'Exportación', label: '02 - Exportación' },
    { code: '04', value: 'Régimen especial del oro de inversión', label: '04 - Régimen especial oro de inversión' },
    { code: '07', value: 'Régimen especial del criterio de caja', label: '07 - Régimen especial criterio de caja' },
    { code: '08', value: 'Operaciones sujetas al IPSI / IGIC (Impuesto sobre la Producción, los Servicios y la Importación / Impuesto General Indirecto Canario)', label: '08 - Operaciones sujetas al IPSI / IGIC' },
    { code: '10', value: 'Cobros por cuenta de terceros de honorarios profesionales o de derechos derivados de la propiedad industrial, de autor u otros por cuenta de sus socios, asociados o colegiados efectuados por sociedades, asociaciones, colegios profesionales u otras entidades que realicen estas funciones de cobro', label: '10 - Cobros por cuenta de terceros' },
    { code: '11', value: 'Operaciones de arrendamiento de local de negocio', label: '11 - Arrendamiento de local de negocio' },
    { code: '14', value: 'Factura con IVA pendiente de devengo en certificaciones de obra cuyo destinatario sea una Administración Pública', label: '14 - IVA pendiente devengo certificaciones obra' },
    { code: '15', value: 'Factura con IVA pendiente de devengo en operaciones de tracto sucesivo', label: '15 - IVA pendiente de devengo tracto sucesivo' },
    { code: '17', value: 'Operación acogida a alguno de los regímenes previstos en el Capítulo XI del Título IX (OSS e IOSS)', label: '17 - OSS e IOSS' },
    { code: '18', value: 'Recargo de equivalencia', label: '18 - Recargo de equivalencia' },
    { code: '19', value: 'Operaciones de actividades incluidas en el Régimen Especial de Agricultura, Ganadería y Pesca (REAGYP)', label: '19 - REAGYP' },
    { code: '20', value: 'Régimen simplificado', label: '20 - Régimen simplificado' },
    { code: '21', value: 'Régimen especial (pendiente confirmación con negocio)', label: '21 - Régimen especial (pendiente confirmación)' }  // TODO: replace with official label
  ];

  function getClientTaxConfig(tipoImpuesto) {
    return TAX_TYPE_CONFIG_CLIENT[tipoImpuesto] || TAX_TYPE_CONFIG_CLIENT.IVA;
  }

  function getClientRegimenConfig(code, tipoImpuesto) {
    var taxType = getClientTaxConfig(tipoImpuesto);
    return taxType.regimenes[code] || null;
  }

  var REGIMEN_VALUE_TO_CODE = {
    'Operación de régimen general': '01',
    'Exportación': '02',
    'Régimen especial del oro de inversión': '04',
    'Régimen especial del criterio de caja': '07',
    'Operaciones sujetas al IPSI / IGIC (Impuesto sobre la Producción, los Servicios y la Importación / Impuesto General Indirecto Canario)': '08',
    'Cobros por cuenta de terceros de honorarios profesionales o de derechos derivados de la propiedad industrial, de autor u otros por cuenta de sus socios, asociados o colegiados efectuados por sociedades, asociaciones, colegios profesionales u otras entidades que realicen estas funciones de cobro': '10',
    'Operaciones de arrendamiento de local de negocio': '11',
    'Factura con IVA pendiente de devengo en certificaciones de obra cuyo destinatario sea una Administración Pública': '14',
    'Factura con IVA pendiente de devengo en operaciones de tracto sucesivo': '15',
    'Operación acogida a alguno de los regímenes previstos en el Capítulo XI del Título IX (OSS e IOSS)': '17',
    'Recargo de equivalencia': '18',
    'Operaciones de actividades incluidas en el Régimen Especial de Agricultura, Ganadería y Pesca (REAGYP)': '19',
    'Régimen simplificado': '20',
    'Régimen especial (pendiente confirmación con negocio)': '21'  // TODO: replace with official label
  };

  var IVA_RECARGO_2025 = {
    '21': ['5,20%', '1,75%'],
    '10': ['1,40%'],
    '4': ['0,50%'],
    '0': ['0,00%']
  };

  var OPERACION_EXENTA_LABELS_CLIENT = {
    'E1': 'E1 - Operaciones interiores exentas (servicios)',
    'E2': 'E2 - Exportaciones de bienes fuera de la UE',
    'E3': 'E3 - Entregas intracomunitarias de bienes',
    'E4': 'E4 - Prestaciones de servicios relacionados con',
    'E5': 'E5 - Operaciones asimiladas a exportaciones',
    'E6': 'E6 - Exenta por otros',
    'E7': 'E7 - Exenta por aplicación del artículo 25 de la Ley 19/1994',
    'E8': 'E8 - Operaciones exentas sin derecho a deducción'
  };

  var TARIFAS_RETENCION = [
    { label: 'Selecciona una opción', value: '' },
    { label: '7%', value: '7' },
    { label: '15%', value: '15' },
    { label: '19%', value: '19' }
  ];

  function mostrarAlerta(mensaje) {
    google.script.run.mostrarAlertaDesdeServidor(mensaje);
  }

  function marcarCampo(id, esError) {
    var campo = document.getElementById(id);
    if (!campo) return;
    campo.style.backgroundColor = esError ? '#FFC7C7' : '';
  }

  function getSelectedRegimenCode() {
    var val = document.getElementById('regimen').value;
    return REGIMEN_VALUE_TO_CODE[val] || '';
  }

  function onRegimenChange() {
    var code = getSelectedRegimenCode();
    var tipoImpuesto = document.getElementById('tipoImpuesto').value;
    var config = getClientRegimenConfig(code, tipoImpuesto);
    var taxConfig = getClientTaxConfig(tipoImpuesto);
    var tarifaSelect = document.getElementById('tarifaImpuesto');
    var tarifaLibre = document.getElementById('tarifaImpuestoLibre');

    if (!config) {
      tarifaSelect.innerHTML = '';
      tarifaSelect.add(new Option('Selecciona régimen primero', ''));
      updateRecargoVisibility();
      actualizarOperacionExenta();
      return;
    }

    // Handle autoExento (régimen 02 = Exportación)
    if (config.autoExento) {
      var exentoCheck = document.getElementById('exento');
      if (!exentoCheck.checked) {
        exentoCheck.checked = true;
        onToggleExento({ target: exentoCheck });
      }
      // Hide IVA incluido on autoExento
      document.getElementById('ivaIncluidoContainer').style.display = 'none';
      document.getElementById('ivaIncluido').checked = false;
    }

    if (taxConfig.tarifaMode === 'freeform' || config.rates === null) {
      // Freeform: show numeric input, hide select dropdown
      tarifaSelect.style.display = 'none';
      tarifaSelect.removeAttribute('required');
      tarifaLibre.style.display = '';
      tarifaLibre.setAttribute('required', '');
      if (config.rates && config.rates.length === 1 && config.rates[0] === 0) {
        tarifaLibre.value = '0';
      }
    } else {
      // Dropdown mode
      tarifaSelect.style.display = '';
      tarifaSelect.setAttribute('required', '');
      tarifaLibre.style.display = 'none';
      tarifaLibre.removeAttribute('required');
      tarifaSelect.innerHTML = '';

      var soloExento = config.rates.length === 1 && config.rates[0] === 0;
      if (soloExento) {
        tarifaSelect.add(new Option('Exento (0%)', '0'));
        tarifaSelect.value = '0';
      } else {
        tarifaSelect.add(new Option('Selecciona una opción', ''));
        config.rates.forEach(function(rate) {
          var label = rate === 0 ? 'Exento (0%)' : rate + '%';
          tarifaSelect.add(new Option(label, String(rate)));
        });
      }
    }

    updateRecargoVisibility();
    actualizarOperacionExenta();
  }

  function onTarifaChange() {
    actualizarOperacionExenta();
    if (document.getElementById('aplicarRecargo').checked) {
      updateTarifaRecargoOptions();
    }
  }

  function actualizarOperacionExenta() {
    var code = getSelectedRegimenCode();
    var tipoImpuesto = document.getElementById('tipoImpuesto').value;
    var config = getClientRegimenConfig(code, tipoImpuesto);
    var container = document.getElementById('operacionExentaContainer');
    var select = document.getElementById('operacionExenta');
    var valorPrevio = select.value;
    var isExento = document.getElementById('exento').checked;
    // Operación exenta is driven exclusively by the "Producto exento" checkbox,
    // never by a 0% tarifa.
    var showExenta = isExento && config && config.exentoOps && config.exentoOps.length > 0;

    if (showExenta) {
      select.innerHTML = '';
      select.add(new Option('Selecciona una opción', ''));
      config.exentoOps.forEach(function(op) {
        var label = OPERACION_EXENTA_LABELS_CLIENT[op] || op;
        select.add(new Option(label, label));
      });
      if (valorPrevio) {
        for (var i = 0; i < select.options.length; i++) {
          if (select.options[i].value === valorPrevio) { select.value = valorPrevio; break; }
        }
      }
      container.style.display = '';
    } else {
      // Hidden: also drop the value so a stale selection is never submitted
      select.innerHTML = '<option value="">Selecciona una opción</option>';
      select.value = '';
      container.style.display = 'none';
    }
  }

  function onTipoImpuestoChange() {
    var tipo = document.getElementById('tipoImpuesto').value;
    var selectTarifa = document.getElementById('tarifaImpuesto');
    var inputTarifa = document.getElementById('tarifaImpuestoLibre');
    var taxConfig = getClientTaxConfig(tipo);

    // Filter régimen options based on tax type
    var regimenSelect = document.getElementById('regimen');
    var prevRegimen = regimenSelect.value;
    regimenSelect.innerHTML = '<option value="">Selecciona una opción</option>';
    ALL_REGIMEN_OPTIONS.forEach(function(opt) {
      if (taxConfig.regimenes[opt.code]) {
        regimenSelect.add(new Option(opt.label, opt.value));
      }
    });
    // Restore previous selection if still valid
    if (prevRegimen) {
      var prevCode = REGIMEN_VALUE_TO_CODE[prevRegimen];
      if (prevCode && taxConfig.regimenes[prevCode]) {
        regimenSelect.value = prevRegimen;
      }
    }

    // Set tarifa mode based on tax type
    if (taxConfig.tarifaMode === 'freeform') {
      selectTarifa.style.display = 'none';
      selectTarifa.removeAttribute('required');
      inputTarifa.style.display = '';
      inputTarifa.setAttribute('required', '');
    } else {
      selectTarifa.style.display = '';
      selectTarifa.setAttribute('required', '');
      inputTarifa.style.display = 'none';
      inputTarifa.removeAttribute('required');
      inputTarifa.value = '';
    }

    // IVA incluido: only available for IVA tax type
    var ivaIncluidoContainer = document.getElementById('ivaIncluidoContainer');
    if (tipo === 'IVA') {
      ivaIncluidoContainer.style.display = '';
    } else {
      ivaIncluidoContainer.style.display = 'none';
      document.getElementById('ivaIncluido').checked = false;
      // Restore exento visibility when switching away from IVA
      document.getElementById('exentoContainer').style.display = '';
    }

    // Re-apply régimen-based rules
    onRegimenChange();
    onTarifaChange();
  }

  function onToggleExento(event) {
    var isExento = event.target.checked;
    var tarifaSelect = document.getElementById('tarifaImpuesto');
    var tarifaLibre = document.getElementById('tarifaImpuestoLibre');
    var calificacionContainer = document.getElementById('calificacionContainer');
    var tarifaContainer = tarifaSelect.closest('.col-6');
    var ivaIncluidoContainer = document.getElementById('ivaIncluidoContainer');

    if (isExento) {
      // Hide tarifa (both select + libre), hide calificación
      tarifaSelect.value = '0';
      tarifaLibre.value = '0';
      tarifaContainer.style.display = 'none';
      tarifaSelect.removeAttribute('required');
      tarifaLibre.removeAttribute('required');
      calificacionContainer.style.display = 'none';
      // Mutual exclusivity: hide + uncheck IVA incluido
      ivaIncluidoContainer.style.display = 'none';
      document.getElementById('ivaIncluido').checked = false;
    } else {
      // Restore tarifa and calificación
      tarifaContainer.style.display = '';
      var tipo = document.getElementById('tipoImpuesto').value;
      var taxCfg = getClientTaxConfig(tipo);
      if (taxCfg.tarifaMode === 'freeform') {
        tarifaLibre.setAttribute('required', '');
      } else {
        tarifaSelect.setAttribute('required', '');
      }
      calificacionContainer.style.display = '';
      // Show IVA incluido only for IVA
      if (tipo === 'IVA') {
        ivaIncluidoContainer.style.display = '';
      }
    }
    updateRecargoVisibility();
    actualizarOperacionExenta();
  }

  function onToggleIvaIncluido(event) {
    var isChecked = event.target.checked;
    var exentoContainer = document.getElementById('exentoContainer');
    if (isChecked) {
      // Mutual exclusivity: hide + uncheck exento
      exentoContainer.style.display = 'none';
      document.getElementById('exento').checked = false;
      // Restore non-exento UI state if needed
      var tarifaSelect = document.getElementById('tarifaImpuesto');
      var tarifaContainer = tarifaSelect.closest('.col-6');
      tarifaContainer.style.display = '';
      document.getElementById('calificacionContainer').style.display = '';
      updateRecargoVisibility();
      actualizarOperacionExenta();
    } else {
      exentoContainer.style.display = '';
    }
  }

  function verificarDatosObligatoriosProducto() {
    var camposObligatorios = [
      'codigoReferencia',
      'nombre',
      'regimen',
      'tipoProducto',
      'tipoUso',
      'valorUnitario',
      'tipoImpuesto'
    ];

    var isValid = true;
    var tipoImpuesto = document.getElementById('tipoImpuesto').value;
    var isFreeform = getClientTaxConfig(tipoImpuesto).tarifaMode === 'freeform';
    var isExento = document.getElementById('exento').checked;

    camposObligatorios.forEach(function(id) {
      var campo = document.getElementById(id);
      var valor = campo ? campo.value.trim() : '';
      var esCampoValido = Boolean(valor);
      marcarCampo(id, !esCampoValido);
      if (!esCampoValido) {
        isValid = false;
      }
    });

    // Validate tarifa: dropdown for IVA, free input for freeform types
    if (isFreeform) {
      var tarifaLibre = document.getElementById('tarifaImpuestoLibre').value;
      var tarifaNum = Number(tarifaLibre);
      if (tarifaLibre === '' || isNaN(tarifaNum) || tarifaNum < 0 || tarifaNum > 100) {
        marcarCampo('tarifaImpuestoLibre', true);
        isValid = false;
      } else {
        marcarCampo('tarifaImpuestoLibre', false);
      }
    } else if (!isExento) {
      var tarifaVal = document.getElementById('tarifaImpuesto').value.trim();
      if (!tarifaVal) {
        marcarCampo('tarifaImpuesto', true);
        isValid = false;
      } else {
        marcarCampo('tarifaImpuesto', false);
      }
    }

    var aplicarRecargo = document.getElementById('aplicarRecargo').checked;
    var recargoSel = document.getElementById('tarifaRecargo').value;
    if (aplicarRecargo && !recargoSel) {
      marcarCampo('tarifaRecargo', true);
      isValid = false;
    } else {
      marcarCampo('tarifaRecargo', false);
    }

    var aplicarRetencion = document.getElementById('aplicarRetencion').checked;
    var retencionSel = document.getElementById('retenciones').value;
    if (aplicarRetencion && !retencionSel) {
      marcarCampo('retenciones', true);
      isValid = false;
    } else {
      marcarCampo('retenciones', false);
    }

    var code = getSelectedRegimenCode();
    var tipoImpuestoVal = document.getElementById('tipoImpuesto').value;
    var config = getClientRegimenConfig(code, tipoImpuestoVal);
    var taxCfg = getClientTaxConfig(tipoImpuestoVal);
    if (config && config.rates !== null && taxCfg.tarifaMode === 'dropdown') {
      var tarifaVal = Number(document.getElementById('tarifaImpuesto').value);
      if (config.rates.indexOf(tarifaVal) === -1 && !isExento) {
        marcarCampo('tarifaImpuesto', true);
        isValid = false;
        mostrarAlerta('La tarifa de ' + tipoImpuestoVal + ' seleccionada no es válida para el régimen ' + code + '.');
      }
    }

    // Mutual exclusivity: exento → require operación exenta; not exento → require calificación
    if (isExento) {
      if (config && config.exentoOps && config.exentoOps.length > 0) {
        var opExenta = document.getElementById('operacionExenta').value;
        if (!opExenta) {
          marcarCampo('operacionExenta', true);
          isValid = false;
        } else {
          marcarCampo('operacionExenta', false);
        }
      }
    } else {
      // Not exento: require calificación
      var califVal = document.getElementById('calificacionOperacion').value;
      if (!califVal) {
        marcarCampo('calificacionOperacion', true);
        isValid = false;
      } else {
        marcarCampo('calificacionOperacion', false);
      }
      // Not exento: operación exenta stays hidden, so it is never required
      marcarCampo('operacionExenta', false);
    }

    return isValid;
  }

  function submitFormProducto() {
    if (verificarDatosObligatoriosProducto()) {
      var form = document.getElementById('productForm');
      form.dispatchEvent(new Event('submit'));
    } else {
      mostrarAlerta('Por favor complete todos los campos obligatorios.');
    }
  }

  function handleSubmitProducto(event) {
    event.preventDefault();
    var form = event.target;
    var formData = new FormData(form);
    formData.set('aplicarRecargo', document.getElementById('aplicarRecargo').checked);
    formData.set('tarifaRecargo', document.getElementById('aplicarRecargo').checked ? document.getElementById('tarifaRecargo').value : '');
    if (document.getElementById('aplicarRetencion').checked) {
      formData.set('retenciones', document.getElementById('retenciones').value);
    } else {
      formData.set('retenciones', '');
    }
    formData.set('calificacionOperacion', document.getElementById('calificacionOperacion').value);
    formData.set('exento', document.getElementById('exento').checked);
    formData.set('ivaIncluido', document.getElementById('ivaIncluido').checked);
    // Freeform tax types: use the free input value
    var taxCfgSubmit = getClientTaxConfig(document.getElementById('tipoImpuesto').value);
    if (taxCfgSubmit.tarifaMode === 'freeform') {
      formData.set('tarifaImpuesto', document.getElementById('tarifaImpuestoLibre').value);
    }

    var data = {};
    formData.forEach(function(value, key) {
      data[key] = value;
    });

    google.script.run.withSuccessHandler(function () {
      resetFormProducto();
    }).processForm(data);
  }

  function resetFormProducto() {
    var form = document.getElementById('productForm');
    form.reset();
    ['codigoReferencia','nombre','regimen','tipoProducto','tipoUso','valorUnitario','tipoImpuesto','tarifaImpuesto','operacionExenta','retenciones']
      .forEach(function(id) { marcarCampo(id, false); });
    document.getElementById('aplicarRecargo').checked = false;
    document.getElementById('tarifaRecargoContainer').style.display = 'none';
    document.getElementById('tarifaRecargo').innerHTML = '<option value="">Selecciona una opción</option>';
    document.getElementById('aplicarRetencion').checked = false;
    document.getElementById('exento').checked = false;
    document.getElementById('ivaIncluido').checked = false;
    document.getElementById('exentoContainer').style.display = '';
    document.getElementById('ivaIncluidoContainer').style.display = '';
    document.getElementById('calificacionContainer').style.display = '';
    document.getElementById('calificacionOperacion').value = 'S1';
    document.getElementById('operacionExentaContainer').style.display = 'none';
    document.getElementById('operacionExenta').innerHTML = '<option value="">Selecciona una opción</option>';
    var tarifaSelect = document.getElementById('tarifaImpuesto');
    tarifaSelect.innerHTML = '<option value="">Selecciona régimen primero</option>';
    tarifaSelect.style.display = '';
    tarifaSelect.disabled = false;
    document.getElementById('tarifaImpuestoLibre').style.display = 'none';
    document.getElementById('tarifaImpuestoLibre').value = '';
    document.getElementById('tarifaImpuestoLibre').disabled = false;
    document.getElementById('tipoImpuesto').value = 'IVA';
    updateRecargoVisibility();
    renderRetencion(false);
    document.getElementById('nombre').focus();
  }

  function obtenerTarifaRecargoActual() {
    var iva = document.getElementById('tarifaImpuesto').value;
    return IVA_RECARGO_2025[iva] || '';
  }

  function renderRetencion(activa) {
    var select = document.getElementById('retenciones');
    select.innerHTML = '';
    if (activa) {
      TARIFAS_RETENCION.forEach(function(op) { select.add(new Option(op.label, op.value)); });
      select.disabled = false;
    } else {
      select.disabled = true;
      select.value = '';
    }
  }

  // Recargo de equivalencia is only offered when every rule allows it:
  // sale of a product, a régimen that permits it (e.g. 08 never does),
  // not exento and a calificación that is not forced to 0%.
  function puedeAplicarRecargo() {
    var tipoProducto = document.getElementById('tipoProducto').value;
    var tipoUso = document.getElementById('tipoUso').value;
    if (tipoProducto !== 'Producto' || tipoUso !== 'Venta') return false;
    if (document.getElementById('exento').checked) return false;
    var calificacion = document.getElementById('calificacionOperacion').value;
    if (['S2', 'N1', 'N2'].indexOf(calificacion) !== -1) return false;
    var config = getClientRegimenConfig(getSelectedRegimenCode(), document.getElementById('tipoImpuesto').value);
    // Fail closed: an unknown or empty regimen never allows recargo
    // (same criterion as isRecargoAllowed in mainScript.js).
    if (!config || !config.allowRecargo) return false;
    return true;
  }

  function updateRecargoVisibility() {
    var recargoContainer = document.getElementById('recargoContainer');
    var recargoCheckbox = document.getElementById('aplicarRecargo');
    var tarifaRecargoContainer = document.getElementById('tarifaRecargoContainer');
    var tarifaRecargo = document.getElementById('tarifaRecargo');
    if (puedeAplicarRecargo()) {
      recargoContainer.style.display = '';
    } else {
      // Full reset: uncheck, clear tarifa value, hide both containers
      recargoContainer.style.display = 'none';
      recargoCheckbox.checked = false;
      tarifaRecargoContainer.style.display = 'none';
      tarifaRecargo.innerHTML = '<option value="">Selecciona una opción</option>';
      tarifaRecargo.value = '';
    }
  }

  function onToggleRecargo(event) {
    var checked = event.target.checked;
    var container = document.getElementById('tarifaRecargoContainer');
    var select = document.getElementById('tarifaRecargo');
    if (checked) {
      updateTarifaRecargoOptions();
      container.style.display = '';
    } else {
      container.style.display = 'none';
      select.value = '';
    }
  }

  function updateTarifaRecargoOptions() {
    var tipoImpuesto = document.getElementById('tipoImpuesto').value;
    var taxCfgRecargo = getClientTaxConfig(tipoImpuesto);
    var tarifaVal = (taxCfgRecargo.tarifaMode === 'freeform')
      ? String(Math.round(Number(document.getElementById('tarifaImpuestoLibre').value)))
      : document.getElementById('tarifaImpuesto').value;
    var select = document.getElementById('tarifaRecargo');
    var prevVal = select.value;
    select.innerHTML = '';
    var options = IVA_RECARGO_2025[tarifaVal];
    if (options && options.length > 1) {
      select.add(new Option('Selecciona una opción', ''));
      options.forEach(function(op) { select.add(new Option(op, op)); });
    } else if (options && options.length === 1) {
      select.add(new Option(options[0], options[0]));
      select.value = options[0];
    } else {
      select.add(new Option('Selecciona tarifa IVA primero', ''));
    }
    // Restore previous value if still valid
    for (var i = 0; i < select.options.length; i++) {
      if (select.options[i].value === prevVal) { select.value = prevVal; break; }
    }
  }

  function onToggleRetencion(event) {
    renderRetencion(event.target.checked);
  }

  function onCalificacionChange() {
    var califVal = document.getElementById('calificacionOperacion').value;
    if (['S2', 'N1', 'N2'].indexOf(califVal) !== -1) {
      // Force tarifa to 0%
      document.getElementById('tarifaImpuesto').value = '0';
      document.getElementById('tarifaImpuestoLibre').value = '0';
    } else if (califVal === 'S1') {
      // Re-apply tarifa based on régimen
      onRegimenChange();
    }
    updateRecargoVisibility();
    actualizarOperacionExenta();
  }

  // Initialize on load
  (function() {
    document.getElementById('calificacionOperacion').addEventListener('change', onCalificacionChange);
    // Initialize régimen options for default tax type (IVA)
    onTipoImpuestoChange();
    updateRecargoVisibility();
  })();
</script>
