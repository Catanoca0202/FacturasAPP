<div class="row py-3 px-4 mt-3 gx-0">
  <div class="col-12 py-4">
    <h2 class="mt-1">Crear producto</h2>
    <p>Ingresa la información de tu nuevo producto.</p>
  </div>

  <div class="col-12 px-0">
    <form class="row g-3" onsubmit="handleSubmitProducto(event)" id="productForm">
      <div class="col-12">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control form-control-lg" id="nombre" name="nombre" required>
      </div>

      <div class="col-12">
        <label for="regimen" class="form-label">Régimen</label>
        <select id="regimen" name="regimen" class="form-select form-select-lg" required onchange="onRegimenChange()">
          <option value="">Selecciona una opción</option>
          <option value="Operación de régimen general">01 - Operación de régimen general</option>
          <option value="Exportación">02 - Exportación</option>
          <option value="Operaciones a las que se aplique el régimen especial de bienes usados, objetos de arte, antigüedades y objetos de colección">03 - Régimen especial bienes usados</option>
          <option value="Régimen especial del oro de inversión">04 - Régimen especial oro de inversión</option>
          <option value="Régimen especial de las agencias de viajes">05 - Régimen especial agencias de viajes</option>
          <option value="Régimen especial del criterio de caja">07 - Régimen especial criterio de caja</option>
          <option value="Facturación de las prestaciones de servicios de agencias de viaje que actúan como mediadoras en nombre y por cuenta ajena (D.A.4ª RD1619/2012)">09 - Agencias de viaje mediadoras</option>
          <option value="Cobros por cuenta de terceros de honorarios profesionales o de derechos derivados de la propiedad industrial, de autor u otros por cuenta de sus socios, asociados o colegiados efectuados por sociedades, asociaciones, colegios profesionales u otras entidades que realicen estas funciones de cobro">10 - Cobros por cuenta de terceros</option>
          <option value="Operaciones de arrendamiento de local de negocio">11 - Arrendamiento de local de negocio</option>
          <option value="Factura con IVA pendiente de devengo en operaciones de tracto sucesivo">15 - IVA pendiente de devengo tracto sucesivo</option>
          <option value="Operación acogida a alguno de los regímenes previstos en el Capítulo XI del Título IX (OSS e IOSS)">17 - OSS e IOSS</option>
          <option value="Recargo de equivalencia">18 - Recargo de equivalencia</option>
          <option value="Operaciones de actividades incluidas en el Régimen Especial de Agricultura, Ganadería y Pesca (REAGYP)">19 - REAGYP</option>
          <option value="Régimen simplificado">20 - Régimen simplificado</option>
        </select>
      </div>

      <div class="col-6">
        <label for="tipoProducto" class="form-label">Tipo producto</label>
        <select id="tipoProducto" name="tipoProducto" class="form-select form-select-lg" required>
          <option value="">Selecciona una opción</option>
          <option value="Producto">Producto</option>
          <option value="Servicio">Servicio</option>
        </select>
      </div>

      <div class="col-6">
        <label for="tipoUso" class="form-label">Tipo de uso</label>
        <select id="tipoUso" name="tipoUso" class="form-select form-select-lg" required>
          <option value="">Selecciona una opción</option>
          <option value="Venta">Venta</option>
          <option value="Compra">Compra</option>
        </select>
      </div>

      <div class="col-6">
        <label for="valorUnitario" class="form-label">Valor unitario</label>
        <input type="number" class="form-control form-control-lg" id="valorUnitario" name="valorUnitario" required step=".01">
      </div>

      <div class="col-6">
        <label for="codigoReferencia" class="form-label">Código referencia</label>
        <input type="text" class="form-control form-control-lg" id="codigoReferencia" name="codigoReferencia" required>
      </div>

      <div class="col-6">
        <label for="tipoImpuesto" class="form-label">Tipo de impuesto</label>
        <select id="tipoImpuesto" name="tipoImpuesto" class="form-select form-select-lg" required onchange="onTipoImpuestoChange()">
          <option value="IVA">IVA</option>
          <option value="IPSI">IPSI</option>
          <option value="IGIC">IGIC</option>
          <option value="Otros">Otros</option>
        </select>
      </div>

      <div class="col-6">
        <label for="tarifaImpuesto" class="form-label">Tarifa impuesto</label>
        <select id="tarifaImpuesto" name="tarifaImpuesto" class="form-select form-select-lg" required onchange="onTarifaChange()">
          <option value="">Selecciona régimen primero</option>
        </select>
        <input type="number" class="form-control form-control-lg" id="tarifaImpuestoLibre"
          min="0" max="100" step="0.01" placeholder="0-100%" style="display:none" onchange="onTarifaChange()">
      </div>

      <div class="col-12" id="operacionExentaContainer" style="display:none">
        <label for="operacionExenta" class="form-label">Operación exenta</label>
        <select id="operacionExenta" name="operacionExenta" class="form-select form-select-lg">
          <option value="">Selecciona una opción</option>
        </select>
      </div>

      <div class="col-6" id="calificacionContainer">
        <label for="calificacionOperacion" class="form-label">Calificación operación</label>
        <select id="calificacionOperacion" name="calificacionOperacion" class="form-select form-select-lg">
          <option value="S1" selected>S1 - No exenta, sin inversión suj. pasivo</option>
          <option value="S2">S2 - No exenta, con inversión suj. pasivo</option>
          <option value="N1">N1 - No sujeta, art. 7/14/otros</option>
          <option value="N2">N2 - No sujeta, por reglas de localización</option>
        </select>
      </div>

      <div class="col-6">
        <div class="form-check mt-4">
          <input class="form-check-input" type="checkbox" id="exento" name="exento" onchange="onToggleExento(event)">
          <label class="form-check-label" for="exento">
            Producto exento
          </label>
        </div>
      </div>

      <div class="col-12" id="recargoContainer">
        <div class="form-check mt-2">
          <input class="form-check-input" type="checkbox" id="aplicarRecargo" name="aplicarRecargo" onchange="onToggleRecargo(event)">
          <label class="form-check-label" for="aplicarRecargo">
            Aplicar recargo de equivalencia automático
          </label>
        </div>
      </div>

      <div class="col-6">
        <div class="form-check mt-2">
          <input class="form-check-input" type="checkbox" id="aplicarRetencion" name="aplicarRetencion" onchange="onToggleRetencion(event)">
          <label class="form-check-label" for="aplicarRetencion">
            Aplicar retención (7%, 15% o 19%)
          </label>
        </div>
      </div>
      <div class="col-6">
        <label for="retenciones" class="form-label">Tarifa retención</label>
        <select id="retenciones" name="retenciones" class="form-select form-select-lg" disabled>
          <option value="">Selecciona una opción</option>
        </select>
      </div>
    </form>
  </div>

  <div class="col-12 mt-4 px-0 d-flex justify-content-between">
    <a href="#" onclick="showView('productos')" class="btn btn-outline-secondary btn-lg">
      <i class="icon-left"></i>
      <span class="ms-1">Regresar</span>
    </a>
    <a href="#" onclick="submitFormProducto()" class="btn btn-primary btn-lg">
      <span class="">Guardar</span>
      <i class="icon-24-outlined-editor-action-save" style="font-size: 18px;"></i>
    </a>
  </div>
</div>

<script>
  var REGIMEN_CONFIG_CLIENT = {
    '01': { ivaRates: [21, 10, 4, 0], allowRecargo: false, exentoOps: ['E1','E4','E5','E6'] },
    '02': { ivaRates: [0], allowRecargo: false, exentoOps: ['E1','E2','E3','E4','E5','E6'] },
    '03': { ivaRates: [21, 10, 4, 0], allowRecargo: false, exentoOps: ['E1','E2','E3','E4','E5','E6'] },
    '04': { ivaRates: [0], allowRecargo: false, exentoOps: ['E1','E2','E3','E4','E5','E6'] },
    '05': { ivaRates: [21, 10, 4, 0], allowRecargo: false, exentoOps: ['E1','E2','E3','E4','E5','E6'] },
    '07': { ivaRates: [21, 10, 4, 0], allowRecargo: false, exentoOps: ['E1','E6'] },
    '09': { ivaRates: [21, 10, 4, 0], allowRecargo: false, exentoOps: ['E1','E2','E3','E4','E5','E6'] },
    '10': { ivaRates: [21, 10, 4, 0], allowRecargo: false, exentoOps: ['E1','E2','E3','E4','E5','E6'], requiresNifIva: true },
    '11': { ivaRates: [21], allowRecargo: false, exentoOps: [] },
    '15': { ivaRates: [21, 10, 4, 0], allowRecargo: false, exentoOps: ['E1','E2','E3','E4','E5','E6'] },
    '17': { ivaRates: [21, 10, 4, 0], allowRecargo: false, exentoOps: ['E1','E2','E3','E4','E5','E6'] },
    '18': { ivaRates: [21, 10, 4, 0], allowRecargo: true, exentoOps: ['E1','E2','E3','E4','E5','E6'] },
    '19': { ivaRates: [21, 10, 4, 0], allowRecargo: false, exentoOps: ['E1','E2','E3','E4','E5','E6'] },
    '20': { ivaRates: [21, 10, 4, 0], allowRecargo: false, exentoOps: ['E1','E2','E3','E4','E5','E6'] }
  };

  var REGIMEN_VALUE_TO_CODE = {
    'Operación de régimen general': '01',
    'Exportación': '02',
    'Operaciones a las que se aplique el régimen especial de bienes usados, objetos de arte, antigüedades y objetos de colección': '03',
    'Régimen especial del oro de inversión': '04',
    'Régimen especial de las agencias de viajes': '05',
    'Régimen especial del criterio de caja': '07',
    'Facturación de las prestaciones de servicios de agencias de viaje que actúan como mediadoras en nombre y por cuenta ajena (D.A.4ª RD1619/2012)': '09',
    'Cobros por cuenta de terceros de honorarios profesionales o de derechos derivados de la propiedad industrial, de autor u otros por cuenta de sus socios, asociados o colegiados efectuados por sociedades, asociaciones, colegios profesionales u otras entidades que realicen estas funciones de cobro': '10',
    'Operaciones de arrendamiento de local de negocio': '11',
    'Factura con IVA pendiente de devengo en operaciones de tracto sucesivo': '15',
    'Operación acogida a alguno de los regímenes previstos en el Capítulo XI del Título IX (OSS e IOSS)': '17',
    'Recargo de equivalencia': '18',
    'Operaciones de actividades incluidas en el Régimen Especial de Agricultura, Ganadería y Pesca (REAGYP)': '19',
    'Régimen simplificado': '20'
  };

  var IVA_RECARGO_2025 = {
    '21': '5,20%',
    '10': '1,40%',
    '4': '0,50%',
    '0': '0,00%'
  };

  var OPERACION_EXENTA_LABELS_CLIENT = {
    'E1': 'E1 - Operaciones interiores exentas (servicios)',
    'E2': 'E2 - Exportaciones de bienes fuera de la UE',
    'E3': 'E3 - Entregas intracomunitarias de bienes',
    'E4': 'E4 - Prestaciones de servicios relacionados con',
    'E5': 'E5 - Operaciones asimiladas a exportaciones',
    'E6': 'E6 - Exenta por otros'
  };

  var TARIFAS_RETENCION = [
    { label: 'Selecciona una opción', value: '' },
    { label: '7%', value: '7' },
    { label: '15%', value: '15' },
    { label: '19%', value: '19' }
  ];

  function mostrarAlerta(mensaje) {
    google.script.run.mostrarAlertaDesdeServidor(mensaje);
  }

  function marcarCampo(id, esError) {
    var campo = document.getElementById(id);
    if (!campo) return;
    campo.style.backgroundColor = esError ? '#FFC7C7' : '';
  }

  function getSelectedRegimenCode() {
    var val = document.getElementById('regimen').value;
    return REGIMEN_VALUE_TO_CODE[val] || '';
  }

  function onRegimenChange() {
    var code = getSelectedRegimenCode();
    var config = REGIMEN_CONFIG_CLIENT[code];
    var tarifaSelect = document.getElementById('tarifaImpuesto');
    var recargoCheck = document.getElementById('aplicarRecargo');
    var recargoContainer = document.getElementById('recargoContainer');

    tarifaSelect.innerHTML = '';

    if (!config) {
      tarifaSelect.add(new Option('Selecciona régimen primero', ''));
      recargoContainer.style.display = '';
      return;
    }

    var soloExento = config.ivaRates.length === 1 && config.ivaRates[0] === 0;

    if (soloExento) {
      tarifaSelect.add(new Option('Exento (0%)', '0'));
      tarifaSelect.value = '0';
    } else {
      tarifaSelect.add(new Option('Selecciona una opción', ''));
      config.ivaRates.forEach(function(rate) {
        var label = rate === 0 ? 'Exento (0%)' : rate + '%';
        tarifaSelect.add(new Option(label, String(rate)));
      });
    }

    recargoContainer.style.display = '';
    actualizarOperacionExenta();
  }

  function onTarifaChange() {
    actualizarOperacionExenta();
  }

  function actualizarOperacionExenta() {
    var code = getSelectedRegimenCode();
    var config = REGIMEN_CONFIG_CLIENT[code];
    var container = document.getElementById('operacionExentaContainer');
    var select = document.getElementById('operacionExenta');
    var valorPrevio = select.value;
    var isExento = document.getElementById('exento').checked;
    var tipoImpuesto = document.getElementById('tipoImpuesto').value;
    var tarifaVal = tipoImpuesto === 'Otros'
      ? Number(document.getElementById('tarifaImpuestoLibre').value)
      : Number(document.getElementById('tarifaImpuesto').value);
    var showExenta = (isExento || tarifaVal === 0) && config && config.exentoOps && config.exentoOps.length > 0;

    if (showExenta) {
      select.innerHTML = '';
      select.add(new Option('Selecciona una opción', ''));
      config.exentoOps.forEach(function(op) {
        var label = OPERACION_EXENTA_LABELS_CLIENT[op] || op;
        select.add(new Option(label, label));
      });
      if (valorPrevio) {
        for (var i = 0; i < select.options.length; i++) {
          if (select.options[i].value === valorPrevio) { select.value = valorPrevio; break; }
        }
      }
      container.style.display = '';
    } else if (config && config.exentoOps && config.exentoOps.length > 0) {
      select.innerHTML = '';
      select.add(new Option('Selecciona una opción', ''));
      config.exentoOps.forEach(function(op) {
        var label = OPERACION_EXENTA_LABELS_CLIENT[op] || op;
        select.add(new Option(label, label));
      });
      container.style.display = 'none';
    } else {
      select.innerHTML = '<option value="">Selecciona una opción</option>';
      select.value = '';
      container.style.display = 'none';
    }
  }

  function onTipoImpuestoChange() {
    var tipo = document.getElementById('tipoImpuesto').value;
    var selectTarifa = document.getElementById('tarifaImpuesto');
    var inputTarifa = document.getElementById('tarifaImpuestoLibre');

    if (tipo === 'Otros') {
      selectTarifa.style.display = 'none';
      selectTarifa.removeAttribute('required');
      inputTarifa.style.display = '';
      inputTarifa.setAttribute('required', '');
    } else {
      selectTarifa.style.display = '';
      selectTarifa.setAttribute('required', '');
      inputTarifa.style.display = 'none';
      inputTarifa.removeAttribute('required');
      inputTarifa.value = '';
    }
    onTarifaChange();
  }

  function onToggleExento(event) {
    var isExento = event.target.checked;
    var tarifaSelect = document.getElementById('tarifaImpuesto');
    var tarifaLibre = document.getElementById('tarifaImpuestoLibre');
    var calificacionContainer = document.getElementById('calificacionContainer');
    var recargoContainer = document.getElementById('recargoContainer');
    var tarifaContainer = tarifaSelect.closest('.col-6');

    if (isExento) {
      // Hide tarifa (both select + libre), hide calificación, hide + uncheck recargo
      tarifaSelect.value = '0';
      tarifaLibre.value = '0';
      tarifaContainer.style.display = 'none';
      tarifaSelect.removeAttribute('required');
      tarifaLibre.removeAttribute('required');
      calificacionContainer.style.display = 'none';
      recargoContainer.style.display = 'none';
      document.getElementById('aplicarRecargo').checked = false;
    } else {
      // Restore tarifa, calificación, recargo
      tarifaContainer.style.display = '';
      var tipo = document.getElementById('tipoImpuesto').value;
      if (tipo === 'Otros') {
        tarifaLibre.setAttribute('required', '');
      } else {
        tarifaSelect.setAttribute('required', '');
      }
      calificacionContainer.style.display = '';
      recargoContainer.style.display = '';
    }
    actualizarOperacionExenta();
  }

  function verificarDatosObligatoriosProducto() {
    var camposObligatorios = [
      'codigoReferencia',
      'nombre',
      'regimen',
      'tipoProducto',
      'tipoUso',
      'valorUnitario',
      'tipoImpuesto'
    ];

    var isValid = true;
    var tipoImpuesto = document.getElementById('tipoImpuesto').value;
    var isOtros = tipoImpuesto === 'Otros';
    var isExento = document.getElementById('exento').checked;

    camposObligatorios.forEach(function(id) {
      var campo = document.getElementById(id);
      var valor = campo ? campo.value.trim() : '';
      var esCampoValido = Boolean(valor);
      marcarCampo(id, !esCampoValido);
      if (!esCampoValido) {
        isValid = false;
      }
    });

    // Validate tarifa: dropdown for standard types, free input for "Otros"
    if (isOtros) {
      var tarifaLibre = document.getElementById('tarifaImpuestoLibre').value;
      var tarifaNum = Number(tarifaLibre);
      if (tarifaLibre === '' || isNaN(tarifaNum) || tarifaNum < 0 || tarifaNum > 100) {
        marcarCampo('tarifaImpuestoLibre', true);
        isValid = false;
      } else {
        marcarCampo('tarifaImpuestoLibre', false);
      }
    } else if (!isExento) {
      var tarifaVal = document.getElementById('tarifaImpuesto').value.trim();
      if (!tarifaVal) {
        marcarCampo('tarifaImpuesto', true);
        isValid = false;
      } else {
        marcarCampo('tarifaImpuesto', false);
      }
    }

    var aplicarRetencion = document.getElementById('aplicarRetencion').checked;
    var retencionSel = document.getElementById('retenciones').value;
    if (aplicarRetencion && !retencionSel) {
      marcarCampo('retenciones', true);
      isValid = false;
    } else {
      marcarCampo('retenciones', false);
    }

    var code = getSelectedRegimenCode();
    var config = REGIMEN_CONFIG_CLIENT[code];
    if (config && !isOtros) {
      var tarifaVal = Number(document.getElementById('tarifaImpuesto').value);
      if (config.ivaRates.indexOf(tarifaVal) === -1 && !isExento) {
        marcarCampo('tarifaImpuesto', true);
        isValid = false;
        mostrarAlerta('La tarifa de IVA seleccionada no es válida para el régimen ' + code + '.');
      }
    }

    // Mutual exclusivity: exento → require operación exenta; not exento → require calificación
    if (isExento) {
      if (config && config.exentoOps && config.exentoOps.length > 0) {
        var opExenta = document.getElementById('operacionExenta').value;
        if (!opExenta) {
          marcarCampo('operacionExenta', true);
          isValid = false;
        } else {
          marcarCampo('operacionExenta', false);
        }
      }
    } else {
      // Not exento: require calificación
      var califVal = document.getElementById('calificacionOperacion').value;
      if (!califVal) {
        marcarCampo('calificacionOperacion', true);
        isValid = false;
      } else {
        marcarCampo('calificacionOperacion', false);
      }
      // If tarifa = 0, also require operación exenta
      var effectiveTarifa = isOtros ? Number(document.getElementById('tarifaImpuestoLibre').value) : Number(document.getElementById('tarifaImpuesto').value);
      if (effectiveTarifa === 0 && config && config.exentoOps && config.exentoOps.length > 0) {
        var opExenta = document.getElementById('operacionExenta').value;
        if (!opExenta) {
          marcarCampo('operacionExenta', true);
          isValid = false;
        } else {
          marcarCampo('operacionExenta', false);
        }
      }
    }

    return isValid;
  }

  function submitFormProducto() {
    if (verificarDatosObligatoriosProducto()) {
      var form = document.getElementById('productForm');
      form.dispatchEvent(new Event('submit'));
    } else {
      mostrarAlerta('Por favor complete todos los campos obligatorios.');
    }
  }

  function handleSubmitProducto(event) {
    event.preventDefault();
    var form = event.target;
    var formData = new FormData(form);
    formData.set('aplicarRecargo', document.getElementById('aplicarRecargo').checked);
    if (document.getElementById('aplicarRetencion').checked) {
      formData.set('retenciones', document.getElementById('retenciones').value);
    } else {
      formData.set('retenciones', '');
    }
    // New fields: calificacion, exento, and free-form tarifa for "Otros"
    formData.set('calificacionOperacion', document.getElementById('calificacionOperacion').value);
    formData.set('exento', document.getElementById('exento').checked);
    if (document.getElementById('tipoImpuesto').value === 'Otros') {
      formData.set('tarifaImpuesto', document.getElementById('tarifaImpuestoLibre').value);
    }

    var data = {};
    formData.forEach(function(value, key) {
      data[key] = value;
    });

    google.script.run.withSuccessHandler(function () {
      resetFormProducto();
    }).processForm(data);
  }

  function resetFormProducto() {
    var form = document.getElementById('productForm');
    form.reset();
    ['codigoReferencia','nombre','regimen','tipoProducto','tipoUso','valorUnitario','tipoImpuesto','tarifaImpuesto','operacionExenta','retenciones']
      .forEach(function(id) { marcarCampo(id, false); });
    document.getElementById('aplicarRecargo').checked = false;
    document.getElementById('aplicarRetencion').checked = false;
    document.getElementById('exento').checked = false;
    document.getElementById('recargoContainer').style.display = '';
    document.getElementById('calificacionContainer').style.display = '';
    document.getElementById('calificacionOperacion').value = 'S1';
    document.getElementById('operacionExentaContainer').style.display = 'none';
    document.getElementById('operacionExenta').innerHTML = '<option value="">Selecciona una opción</option>';
    var tarifaSelect = document.getElementById('tarifaImpuesto');
    tarifaSelect.innerHTML = '<option value="">Selecciona régimen primero</option>';
    tarifaSelect.style.display = '';
    tarifaSelect.disabled = false;
    document.getElementById('tarifaImpuestoLibre').style.display = 'none';
    document.getElementById('tarifaImpuestoLibre').value = '';
    document.getElementById('tarifaImpuestoLibre').disabled = false;
    document.getElementById('tipoImpuesto').value = 'IVA';
    renderRetencion(false);
    document.getElementById('nombre').focus();
  }

  function obtenerTarifaRecargoActual() {
    var iva = document.getElementById('tarifaImpuesto').value;
    return IVA_RECARGO_2025[iva] || '';
  }

  function renderRetencion(activa) {
    var select = document.getElementById('retenciones');
    select.innerHTML = '';
    if (activa) {
      TARIFAS_RETENCION.forEach(function(op) { select.add(new Option(op.label, op.value)); });
      select.disabled = false;
    } else {
      select.disabled = true;
      select.value = '';
    }
  }

  function onToggleRecargo(event) {
    // recargo independiente
  }

  function onToggleRetencion(event) {
    renderRetencion(event.target.checked);
  }
</script>
